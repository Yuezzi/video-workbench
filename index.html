<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="运营台">
<meta name="theme-color" content="#4f7cff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>视频运营工作台</title>
<style>
:root{
  --bg:#fffaf3;--card:rgba(255,255,255,0.42);--card-solid:#fff;--text:#3d2e1f;--t2:#6b5440;--t3:#9a7b5e;
  --border:rgba(255,255,255,0.65);--border2:rgba(180,140,100,0.15);
  --primary:#6ba4d9;--primary-bg:rgba(107,164,217,0.12);--primary2:#5a8db8;
  --success:#7fb88e;--success-bg:rgba(127,184,142,0.15);
  --warning:#d4915c;--warning-bg:rgba(212,145,92,0.12);
  --danger:#e87a8f;--danger-bg:rgba(232,122,143,0.12);--danger-border:rgba(255,154,162,0.35);
  --purple:#9b7bd4;--purple-bg:rgba(155,123,212,0.12);
  --brown:#d4a373;--brown-bg:rgba(212,163,115,0.12);
  --shadow-sm:0 4px 16px rgba(180,140,100,0.06);
  --shadow-md:0 8px 32px rgba(180,140,100,0.1);
  --glass:blur(28px) saturate(180%);
  --r:24px;--rs:16px;--rl:28px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 5%,rgba(255,214,224,0.45) 0%,transparent 30%),radial-gradient(circle at 88% 10%,rgba(200,231,255,0.45) 0%,transparent 30%),radial-gradient(circle at 50% 50%,rgba(255,229,200,0.3) 0%,transparent 35%),linear-gradient(165deg,#fffaf3,#fef5ec);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;user-select:none}
body.has-bg::before{content:"";position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center;background-repeat:no-repeat}
body.has-bg::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,250,243,0.35) 0%,rgba(255,250,243,0.55) 100%);backdrop-filter:blur(2px)}
input,textarea,select{font-family:inherit;font-size:inherit;user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.app{display:flex;flex-direction:column;height:100%;max-width:680px;margin:0 auto;position:relative}

/* Header - 玻璃质感 */
.header{flex-shrink:0;padding:calc(14px + var(--safe-top)) 16px 12px;background:rgba(255,255,255,0.45);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;z-index:10;box-shadow:0 4px 24px rgba(180,140,100,0.06)}
.header-title{font-size:19px;font-weight:800;letter-spacing:-.3px;color:#5a3e2b}
.header-sub{font-size:12px;color:var(--t3);margin-top:2px;font-weight:500}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);color:var(--brown);font-size:18px;transition:transform .1s;box-shadow:var(--shadow-sm)}
.icon-btn:active{transform:scale(.92)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 100px}

/* Stats - Bento 小卡片 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:16px 8px;text-align:center;box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.9)}
.stat-v{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat-l{font-size:11px;color:var(--t3);margin-top:3px;font-weight:600}
.stat.primary .stat-v{color:var(--primary)}
.stat.warning .stat-v{color:var(--warning)}
.stat.danger .stat-v{color:var(--danger)}

/* Section */
.section{margin-bottom:20px}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.section-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:#5a3e2b}
.section-t .cnt{font-size:11px;font-weight:700;color:var(--t3);background:rgba(255,255,255,0.5);padding:3px 10px;border-radius:12px;border:1px solid var(--border)}
.section-a{font-size:13px;color:var(--primary);font-weight:600;padding:4px 8px}

/* Alert - 珊瑚粉玻璃 */
.alert{background:linear-gradient(135deg,rgba(255,154,162,0.3),rgba(255,180,170,0.2));backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--danger-border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 8px 32px rgba(255,138,128,0.15),inset 0 1px 0 rgba(255,255,255,0.6)}
.alert-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.alert-c{flex:1;min-width:0}
.alert-tt{font-weight:700;font-size:14px;margin-bottom:2px;color:#c25a6f}
.alert-tx{font-size:12px;color:var(--t2);line-height:1.4}

/* Today task card */
.task-row{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.8);display:flex;align-items:center;gap:12px;transition:transform .1s}
.task-row:active{transform:scale(.985)}
.task-row .tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;flex-shrink:0}
.tag-publish{background:rgba(107,164,217,0.15);color:var(--primary2)}
.tag-follow{background:rgba(212,145,92,0.15);color:#b87a4d}
.tag-shoot{background:rgba(232,122,143,0.15);color:#c25a6f}
.task-row .info{flex:1;min-width:0}
.task-row .tt{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.task-row .tx{font-size:12px;color:var(--t3);margin-top:2px}
.task-row .go{color:#c4a882;font-size:18px;flex-shrink:0}

/* Client card - 玻璃大卡片 */
.client-card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.9);transition:transform .1s;position:relative;overflow:hidden}
.client-card:active{transform:scale(.985)}
.client-card.alert{background:linear-gradient(135deg,rgba(255,200,200,0.3),rgba(255,220,220,0.2));border-color:var(--danger-border)}
.client-card.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9aa2,#ff7a82);border-radius:5px 0 0 5px}
.client-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.client-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--text)}
.client-name .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.1);border:2px solid rgba(255,255,255,0.6)}
.client-actions{display:flex;gap:6px}
.client-act{width:32px;height:32px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.5)}
.client-act:active{background:rgba(180,140,100,0.1)}
.client-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.client-stat{background:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:12px 6px;text-align:center}
.client-stat .v{font-size:18px;font-weight:800;line-height:1}
.client-stat .l{font-size:10px;color:var(--t3);margin-top:2px;font-weight:600}
.client-stat.stock-low .v{color:var(--danger)}
.client-alert-tag{display:inline-flex;align-items:center;gap:5px;background:rgba(255,154,162,0.12);color:#c25a6f;font-size:12px;font-weight:600;padding:5px 12px;border-radius:10px;margin-top:12px;border:1px solid rgba(255,154,162,0.2)}

/* Channel badges */
.channels{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.ch{font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;display:flex;align-items:center;gap:3px}
.ch.done{background:var(--success-bg);color:#5a9a6e}
.ch.todo{background:rgba(255,255,255,0.4);color:var(--t3)}

/* Status badge */
.status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.s-editing{background:var(--warning-bg);color:#b87a4d}
.s-final{background:var(--purple-bg);color:var(--purple)}
.s-pending{background:var(--primary-bg);color:var(--primary2)}
.s-published{background:var(--success-bg);color:#5a9a6e}

/* Progress bar */
.prog{height:5px;background:rgba(255,255,255,0.4);border-radius:3px;margin-top:8px;overflow:hidden}
.prog-fill{height:100%;background:var(--success);border-radius:3px;transition:width .3s}

/* Video card */
.video-card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--rl);padding:14px;margin-bottom:8px;box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.8);transition:transform .1s}
.video-card:active{transform:scale(.985)}
.video-card.done{opacity:.7}
.vc-top{display:flex;align-items:flex-start;gap:10px}
.vc-thumb{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.vc-thumb.editing{background:linear-gradient(135deg,#d4915c,#c4814a)}
.vc-thumb.final{background:linear-gradient(135deg,#9b7bd4,#8268c4)}
.vc-thumb.pending{background:linear-gradient(135deg,#6ba4d9,#5a8db8)}
.vc-thumb.published{background:linear-gradient(135deg,#7fb88e,#6aa87a)}
.vc-info{flex:1;min-width:0}
.vc-title{font-weight:600;font-size:14px;word-break:break-word;color:var(--text)}
.vc-meta{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:12px;color:var(--t3);flex-wrap:wrap}
.vc-actions{display:flex;gap:4px;flex-shrink:0}
.vc-act{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;background:rgba(255,255,255,0.4)}
.vc-act:active{background:rgba(180,140,100,0.1)}
.vc-prog-text{font-size:11px;color:var(--t3);margin-top:4px}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.empty-text{font-size:14px}

/* Bottom nav - 玻璃 */
.nav{flex-shrink:0;display:flex;background:rgba(255,255,255,0.55);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);height:calc(58px + var(--safe-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t3);font-size:11px;font-weight:500;transition:color .15s}
.nav-item.active{color:var(--primary);font-weight:700}
.nav-icon{font-size:20px;line-height:1}

/* FAB */
.fab{position:absolute;right:18px;bottom:calc(72px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#d4a373,#c48a5c);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(196,138,92,0.4),inset 0 2px 0 rgba(255,255,255,0.3);z-index:20;transition:transform .15s;border:2px solid rgba(255,255,255,0.4)}
.fab:active{transform:scale(.9)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(120,90,60,0.3);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:rgba(255,250,243,0.85);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:28px 28px 0 0;width:100%;max-width:680px;padding:20px 20px calc(20px + var(--safe-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto;border:1px solid var(--border);box-shadow:0 -8px 32px rgba(180,140,100,0.12)}
.overlay.show .modal{transform:translateY(0)}
.handle{width:36px;height:4px;background:rgba(180,140,100,0.2);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;text-align:center;color:#5a3e2b}

.fg{margin-bottom:12px}
.fl{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:5px;display:block}
.fi,.ft,.fsel{width:100%;padding:11px 13px;border:1.5px solid var(--border2);border-radius:14px;background:rgba(255,255,255,0.5);color:var(--text);font-size:15px;outline:none;transition:border-color .15s}
.fi:focus,.ft:focus,.fsel:focus{border-color:var(--primary);background:#fff}
.ft{resize:none;min-height:70px}
.fr{display:flex;gap:10px}
.fr>.fg{flex:1}

.sel-row{display:flex;gap:6px;flex-wrap:wrap}
.sel-btn{flex:1;min-width:60px;padding:9px;border:1.5px solid var(--border2);border-radius:14px;background:rgba(255,255,255,0.4);font-size:13px;font-weight:600;color:var(--t2);text-align:center;transition:all .15s}
.sel-btn.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary2)}

/* Channel checkboxes */
.ch-checks{display:flex;flex-direction:column;gap:8px}
.ch-check{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--border2);border-radius:14px;background:rgba(255,255,255,0.4);transition:all .15s}
.ch-check.active{border-color:var(--success);background:var(--success-bg)}
.ch-check .box{width:20px;height:20px;border-radius:6px;border:2px solid rgba(180,140,100,0.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.ch-check.active .box{background:var(--success);border-color:var(--success);color:#fff;font-size:12px}
.ch-check .name{font-size:14px;font-weight:600;flex:1;color:var(--text)}
.ch-check .date{font-size:11px;color:var(--t3)}
.ch-check .date-input{font-size:12px;border:1px solid var(--border2);border-radius:8px;padding:4px 6px;background:rgba(255,255,255,0.6);color:var(--text)}

/* Channel manager */
.ch-mgr-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border2);border-radius:14px;background:rgba(255,255,255,0.4);margin-bottom:6px}
.ch-mgr-item .name{flex:1;font-size:14px;font-weight:600}
.ch-mgr-item .del{color:var(--danger);font-size:16px;width:28px;height:28px;display:flex;align-items:center;justify-content:center}

.modal-actions{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:14px;font-size:15px;font-weight:600;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#d4a373,#c48a5c);color:#fff}
.btn-secondary{background:rgba(180,140,100,0.15);color:var(--t2)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-success{background:var(--success);color:#fff}

/* Toast */
.toast{position:fixed;top:calc(16px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-100px);background:rgba(90,62,43,0.9);backdrop-filter:blur(20px);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:200;transition:transform .3s cubic-bezier(.32,.72,0,1);white-space:nowrap;display:flex;align-items:center;gap:10px}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .undo-btn{background:rgba(255,255,255,0.25);color:#fff;border:none;padding:4px 14px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.toast .undo-btn:active{background:rgba(255,255,255,0.4)}

/* Page */
.page{display:none}.page.active{display:block}

/* Calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.cal-dow{text-align:center;font-size:11px;color:var(--t3);font-weight:600;padding:6px 0}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:500;position:relative;background:rgba(255,255,255,0.35);gap:2px}
.cal-day.empty{background:transparent}
.cal-day.today{background:var(--primary-bg);color:var(--primary);font-weight:700}
.cal-day.has-task{background:linear-gradient(135deg,#d4a373,#c48a5c);color:#fff;font-weight:600}
.cal-day.has-task.today{box-shadow:0 0 0 2px var(--brown)}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--success)}
.cal-day.has-task .dot{background:#fff;opacity:.8}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px}
.cal-month{font-size:15px;font-weight:700;color:#5a3e2b}
.cal-arrow{width:34px;height:34px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--t2)}

/* Schedule timeline */
.tl-date{font-size:13px;font-weight:700;color:var(--t2);margin:14px 0 8px;padding-left:4px;display:flex;align-items:center;gap:8px}
.tl-date:first-child{margin-top:0}
.tl-date .dbadge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--primary-bg);color:var(--primary2)}
.tl-date.today .dbadge{background:var(--primary);color:#fff}

/* Color picker */
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:all .15s}
.color-opt.active{border-color:#5a3e2b;transform:scale(1.1)}

/* Install hint */
.install-hint{background:var(--primary-bg);border:1px solid rgba(107,164,217,0.25);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:12px;color:var(--primary2);line-height:1.5}
.install-hint b{display:block;margin-bottom:3px;font-size:13px}
.install-hint .close{float:right;font-size:16px;line-height:1;color:var(--primary);padding:0 4px}

/* Back header */
.back-header{display:flex;align-items:center;gap:10px}
.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,0.4);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--t2)}

/* Settings */
.settings-list{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.s-item{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border2);font-size:15px;color:var(--text)}
.s-item:last-child{border-bottom:none}
.s-item:active{background:rgba(180,140,100,0.06)}
.s-item-label{display:flex;align-items:center;gap:10px}
.s-item-icon{font-size:17px;width:20px;text-align:center}
.s-item-value{color:var(--t3);font-size:13px}
.s-item.danger{color:var(--danger)}

/* AI Assistant */
.ai-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:14px;background:linear-gradient(135deg,#9b7bd4,#8268c4);color:#fff;font-size:14px;font-weight:600;margin-top:10px;transition:transform .1s;box-shadow:0 4px 16px rgba(155,123,212,0.3)}
.ai-btn:active{transform:scale(.97)}
.ai-btn .icon{font-size:16px}

.ai-modal-body{font-size:14px}
.ai-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.ai-tab{flex-shrink:0;padding:8px 14px;border:1.5px solid var(--border2);border-radius:20px;background:rgba(255,255,255,0.4);font-size:13px;font-weight:600;color:var(--t2);white-space:nowrap;transition:all .15s}
.ai-tab.active{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}

.ai-result{background:rgba(255,255,255,0.35);border:1px solid var(--border);border-radius:14px;padding:14px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;margin-bottom:10px;color:var(--text)}
.ai-result.empty{color:var(--t3);text-align:center;padding:30px 12px}
.ai-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:20px;color:var(--t3);font-size:13px}
.ai-loading .dots{display:flex;gap:3px}
.ai-loading .dot{width:6px;height:6px;border-radius:50%;background:var(--purple);animation:dot-bounce 1.2s infinite}
.ai-loading .dot:nth-child(2){animation-delay:.2s}
.ai-loading .dot:nth-child(3){animation-delay:.4s}
@keyframes dot-bounce{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}

.ai-prompt-input{width:100%;padding:11px 13px;border:1.5px solid var(--border2);border-radius:14px;background:rgba(255,255,255,0.5);font-size:14px;outline:none;transition:border-color .15s;min-height:60px;resize:vertical;font-family:inherit;color:var(--text)}
.ai-prompt-input:focus{border-color:var(--purple);background:#fff}

.ai-video-upload{border:2px dashed var(--border2);border-radius:14px;padding:20px;text-align:center;color:var(--t3);font-size:13px;cursor:pointer;transition:all .15s}
.ai-video-upload:active{border-color:var(--purple);background:var(--purple-bg)}
.ai-video-upload.has-file{border-color:var(--success);background:var(--success-bg);color:#5a9a6e}
.ai-video-upload input{display:none}

.ai-gen-actions{display:flex;gap:8px;margin-top:10px}
.ai-gen-btn{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:600;text-align:center;transition:transform .1s}
.ai-gen-btn:active{transform:scale(.97)}
.ai-gen-btn.primary{background:linear-gradient(135deg,#9b7bd4,#8268c4);color:#fff}
.ai-gen-btn.secondary{background:rgba(180,140,100,0.15);color:var(--t2)}

.ai-history{margin-top:12px;border-top:1px solid var(--border2);padding-top:12px}
.ai-history-title{font-size:12px;color:var(--t3);margin-bottom:8px;font-weight:600}
.ai-history-item{background:rgba(255,255,255,0.35);border-radius:12px;padding:10px;margin-bottom:6px;font-size:13px;line-height:1.5;cursor:pointer;border:1px solid var(--border2)}
.ai-history-item:active{background:rgba(180,140,100,0.08)}
.ai-history-item .type{font-size:11px;color:var(--purple);font-weight:600;margin-bottom:2px}
.ai-history-item .preview{color:var(--t2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* ============================================================
   V3 Bento Grid - 首页液态玻璃模块布局
   ============================================================ */
.greeting{padding:6px 6px 14px;display:flex;align-items:center;justify-content:space-between}
.greeting-text{font-size:13px;color:var(--t3);font-weight:500}
.greeting-text b{font-size:20px;color:#5a3e2b;font-weight:800;display:block;margin-top:2px}
.greeting-actions{display:flex;gap:8px}
.greet-btn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.5);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,0.9);color:var(--brown)}
.greet-btn:active{transform:scale(.92)}

/* 6列网格 */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}

/* 卡片基础 - 与 .card 共用玻璃质感 */
.card{background:var(--card);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.9);position:relative;overflow:hidden}

/* 大数字卡 - 占3列 */
.c-num{grid-column:span 3;border-radius:var(--r);padding:16px;transition:transform .1s}
.c-num:active{transform:scale(.97)}
.c-num-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.c-num-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.c-num-trend{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.c-num-v{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.c-num-l{font-size:11px;color:var(--t3);margin-top:3px;font-weight:600}
.c-num.blue .c-num-icon{background:rgba(107,164,217,0.2)}
.c-num.blue .c-num-v{color:var(--primary)}
.c-num.blue .c-num-trend{background:rgba(107,164,217,0.15);color:var(--primary2)}
.c-num.orange .c-num-icon{background:rgba(212,145,92,0.2)}
.c-num.orange .c-num-v{color:var(--warning)}
.c-num.orange .c-num-trend{background:rgba(212,145,92,0.15);color:#b87a4d}
.c-num.pink .c-num-icon{background:rgba(232,122,143,0.2)}
.c-num.pink .c-num-v{color:var(--danger)}
.c-num.pink .c-num-trend{background:rgba(232,122,143,0.15);color:#c25a6f}

/* 提醒卡 - 占6列 */
.c-alert{grid-column:span 6;border-radius:var(--r);padding:16px;background:linear-gradient(135deg,rgba(255,154,162,0.3),rgba(255,180,170,0.2));border:1px solid var(--danger-border);display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .1s}
.c-alert:active{transform:scale(.98)}
.c-alert-icon{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff9aa2,#ff7a82);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;box-shadow:0 4px 16px rgba(255,122,130,0.3)}
.c-alert-content{flex:1;min-width:0}
.c-alert-title{font-size:14px;font-weight:700;color:#c25a6f;margin-bottom:2px}
.c-alert-text{font-size:11px;color:var(--t2);line-height:1.4}
.c-alert-go{color:#c25a6f;font-size:18px;flex-shrink:0}

/* 今日待办 - 占6列 */
.c-today{grid-column:span 6;border-radius:var(--rl);padding:18px}
.c-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.c-title{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.c-badge{font-size:10px;font-weight:700;color:var(--t3);background:rgba(255,255,255,0.5);padding:3px 10px;border-radius:10px;border:1px solid var(--border)}
.c-more{font-size:11px;color:var(--primary);font-weight:600}

/* 任务条（Bento版） */
.t-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(180,140,100,0.06);cursor:pointer}
.t-row:last-child{border-bottom:none;padding-bottom:0}
.t-row:first-child{padding-top:0}
.t-row:active{opacity:.6}
.t-tag{font-size:10px;font-weight:700;padding:4px 9px;border-radius:8px;flex-shrink:0;min-width:32px;text-align:center}
.tt-blue{background:rgba(107,164,217,0.15);color:var(--primary2)}
.tt-orange{background:rgba(212,145,92,0.15);color:#b87a4d}
.tt-pink{background:rgba(232,122,143,0.15);color:#c25a6f}
.tt-green{background:var(--success-bg);color:#5a9a6e}
.t-info{flex:1;min-width:0}
.t-tt{font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tx{font-size:11px;color:var(--t3);margin-top:1px}
.t-go{color:#c4a882;font-size:16px}

/* 进度卡 - 占3列 */
.c-progress{grid-column:span 3;border-radius:var(--r);padding:16px}
.c-progress-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.p-row{margin-bottom:10px}
.p-row:last-child{margin-bottom:0}
.p-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px}
.p-name{font-weight:600;color:var(--text)}
.p-val{color:var(--t3)}
.p-bar{height:5px;background:rgba(255,255,255,0.4);border-radius:3px;overflow:hidden}
.p-fill{height:100%;border-radius:3px;transition:width .3s}

/* 客户卡 - 占6列（Bento版） */
.c-client{grid-column:span 6;border-radius:var(--rl);padding:18px;cursor:pointer;transition:transform .1s}
.c-client:active{transform:scale(.98)}
.c-client.alert{background:linear-gradient(135deg,rgba(255,200,200,0.3),rgba(255,220,220,0.2));border-color:rgba(255,154,162,0.3)}
.c-client.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,#ff9aa2,#ff7a82);border-radius:5px 0 0 5px}
.client-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.client-name{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
.client-dot{width:14px;height:14px;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.1);border:2px solid rgba(255,255,255,0.6);flex-shrink:0}
.client-acts{display:flex;gap:6px}
.c-act{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px}
.c-act:active{background:rgba(180,140,100,0.1)}
.client-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cs{background:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.4);border-radius:14px;padding:12px 6px;text-align:center}
.cs-v{font-size:18px;font-weight:800;line-height:1}
.cs-l{font-size:10px;color:var(--t3);margin-top:2px;font-weight:600}
.cs.low .cs-v{color:var(--danger)}
.client-warn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,154,162,0.12);color:#c25a6f;font-size:11px;font-weight:600;padding:5px 12px;border-radius:10px;margin-top:12px;border:1px solid rgba(255,154,162,0.2)}

/* 分区标签 */
.section-label{text-align:center;font-size:11px;color:var(--t3);margin:18px 0 10px;font-weight:600;letter-spacing:1px;grid-column:span 6}

/* 空状态（Bento版） */
.c-empty{grid-column:span 6;text-align:center;padding:30px 20px;color:var(--t3);font-size:13px}

/* ============================================================
   V6 — 封面图 + 大按钮首页 + 拖拽排期日历
   ============================================================ */

/* 封面图区 */
.cover{position:relative;height:140px;border-radius:28px;overflow:hidden;margin-bottom:14px;cursor:pointer;background:linear-gradient(135deg,#e8c4a0,#d4a373,#c48a5c);box-shadow:var(--shadow-md)}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(0,0,0,0.35) 100%);display:flex;align-items:flex-end;padding:16px 18px}
.cover-overlay .greeting-text{font-size:13px;color:rgba(255,255,255,0.85);font-weight:500}
.cover-overlay .greeting-text b{font-size:22px;color:#fff;font-weight:800;display:block;margin-top:2px}
.cover-hint{position:absolute;top:10px;right:12px;font-size:11px;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.2);padding:4px 10px;border-radius:10px;backdrop-filter:blur(10px)}

/* 大按钮网格 */
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.big-btn{border-radius:28px;padding:22px 18px;min-height:138px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;cursor:pointer;transition:transform .12s;backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid rgba(255,255,255,0.65);box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,0.9)}
.big-btn:active{transform:scale(.96)}
.btn-blue{background:linear-gradient(145deg,rgba(107,164,217,0.25),rgba(107,164,217,0.08));border-color:rgba(107,164,217,0.3)}
.btn-orange{background:linear-gradient(145deg,rgba(212,145,92,0.25),rgba(212,145,92,0.08));border-color:rgba(212,145,92,0.3)}
.btn-pink{background:linear-gradient(145deg,rgba(232,122,143,0.25),rgba(232,122,143,0.08));border-color:rgba(232,122,143,0.3)}
.btn-purple{background:linear-gradient(145deg,rgba(155,123,212,0.25),rgba(155,123,212,0.08));border-color:rgba(155,123,212,0.3)}
.btn-green{background:linear-gradient(145deg,rgba(127,184,142,0.25),rgba(127,184,142,0.08));border-color:rgba(127,184,142,0.3)}
.btn-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:auto}
.btn-blue .btn-icon{background:rgba(107,164,217,0.2)}
.btn-orange .btn-icon{background:rgba(212,145,92,0.2)}
.btn-pink .btn-icon{background:rgba(232,122,143,0.2)}
.btn-purple .btn-icon{background:rgba(155,123,212,0.2)}
.btn-green .btn-icon{background:rgba(127,184,142,0.2)}
.btn-body{margin-top:12px}
.btn-v{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.btn-blue .btn-v{color:var(--primary)}
.btn-orange .btn-v{color:var(--warning)}
.btn-pink .btn-v{color:var(--danger)}
.btn-purple .btn-v{color:var(--purple)}
.btn-green .btn-v{color:var(--success)}
.btn-l{font-size:13px;color:var(--text);font-weight:700;margin-top:3px}
.btn-sub{font-size:11px;color:var(--t3);margin-top:1px;font-weight:500}
.btn-badge{position:absolute;top:12px;right:12px;min-width:22px;height:22px;border-radius:11px;background:#ff7a82;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 3px 10px rgba(255,122,130,0.4)}
.big-btn.wide{grid-column:span 2;min-height:auto;flex-direction:row;align-items:center;gap:14px;padding:16px 18px}
.big-btn.wide .btn-icon{margin-bottom:0;flex-shrink:0}
.big-btn.wide .btn-body{margin-top:0;flex:1}
.big-btn.wide .btn-v{font-size:22px}

/* 拖拽排期布局 */
.sched-layout{display:flex;gap:12px}
.video-sidebar{width:260px;flex-shrink:0;max-height:calc(100vh - 200px);overflow-y:auto;padding:10px;background:rgba(255,255,255,0.35);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:var(--r)}
.sidebar-title{font-size:13px;font-weight:700;color:#5a3e2b;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.sidebar-hint{font-size:10px;color:var(--t3);background:rgba(255,255,255,0.3);border-radius:8px;padding:6px 8px;margin-bottom:8px;line-height:1.4}
.client-group{margin-bottom:10px}
.client-label{font-size:11px;font-weight:700;color:var(--t2);padding:5px 8px;margin-bottom:5px;display:flex;align-items:center;gap:6px;border-radius:8px;background:rgba(255,255,255,0.3)}
.video-chip{background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.6);border-radius:12px;padding:9px 10px;margin-bottom:5px;cursor:grab;transition:all .12s;display:flex;align-items:center;gap:7px;box-shadow:0 2px 8px rgba(180,140,100,0.06)}
.video-chip:hover{background:rgba(255,255,255,0.75);transform:translateY(-1px)}
.video-chip.dragging{opacity:.4}
.video-chip.ready{border-left:3px solid var(--success)}
.video-chip.editing{border-left:3px solid var(--warning);cursor:not-allowed;opacity:.55}
.video-chip.pending{border-left:3px solid var(--primary)}
.chip-icon{font-size:14px;flex-shrink:0}
.chip-info{flex:1;min-width:0}
.chip-title{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-meta{font-size:9px;color:var(--t3);margin-top:1px}
.chip-status{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;flex-shrink:0}

/* 大格子日历 */
.cal-grid-drag{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-content:start}
.cgd-dow{text-align:center;font-size:11px;font-weight:700;color:var(--t3);padding:4px 0}
.cal-cell{min-height:84px;border-radius:12px;background:rgba(255,255,255,0.3);border:1.5px solid rgba(255,255,255,0.5);padding:5px;display:flex;flex-direction:column;gap:3px;transition:all .12s}
.cal-cell.empty{background:transparent;border:1.5px dashed rgba(180,140,100,0.08)}
.cal-cell.today{background:rgba(107,164,217,0.08);border-color:rgba(107,164,217,0.3)}
.cal-cell.past{opacity:.7}
.cal-cell.drag-over{background:rgba(155,123,212,0.15);border-color:var(--purple);border-style:solid;transform:scale(1.03)}
.cal-cell-date{font-size:11px;font-weight:700;color:var(--text)}
.cal-cell.today .cal-cell-date{color:var(--primary)}
.cal-cell.empty .cal-cell-date{color:rgba(154,123,94,0.4)}
.cal-video{font-size:9px;font-weight:600;padding:3px 5px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.3}
.cal-video .cv-client{font-size:8px;opacity:.7;display:block}
.cal-video.published{opacity:.6}

/* 未排期提醒 */
.unsched-alert{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,rgba(255,154,162,0.2),rgba(255,180,170,0.12));border:1px solid rgba(255,154,162,0.25);display:none}
.unsched-alert.show{display:block}
.unsched-title{font-size:13px;font-weight:700;color:#c25a6f;margin-bottom:8px}
.unsched-item{font-size:12px;color:var(--t2);padding:5px 0;border-bottom:1px solid rgba(180,140,100,0.08);display:flex;align-items:center;justify-content:space-between}
.unsched-item:last-child{border-bottom:none}

/* 自动排期弹窗 */
.auto-modal{position:fixed;inset:0;background:rgba(90,62,43,0.3);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.auto-modal.show{opacity:1;pointer-events:auto}
.auto-box{background:rgba(255,250,243,0.95);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-radius:24px;padding:22px;width:340px;max-width:90vw;box-shadow:0 16px 48px rgba(90,62,43,0.2);border:1px solid var(--border);max-height:80vh;overflow-y:auto}
.auto-title{font-size:16px;font-weight:700;color:#5a3e2b;margin-bottom:14px;text-align:center}
.auto-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13px}
.auto-row:last-of-type{border-bottom:none}
.auto-row .label{color:var(--t2);font-weight:600}
.auto-row .value{color:var(--t3)}
.auto-preview{margin:12px 0;padding:12px;background:var(--purple-bg);border-radius:12px;font-size:12px;color:var(--purple);line-height:1.7;max-height:200px;overflow-y:auto}
.auto-preview .unsched{color:var(--danger);font-weight:600;margin-top:6px;padding-top:6px;border-top:1px solid rgba(180,140,100,0.1)}
.auto-actions{display:flex;gap:10px;margin-top:8px}

/* 响应式 - 窄屏上下布局 */
@media(max-width:680px){
  .sched-layout{flex-direction:column}
  .video-sidebar{width:100%;max-height:220px}
  .cal-cell{min-height:62px}
  .cal-grid-drag{gap:3px}
}

/* ========== 可视化看板 ========== */
.dash-toolbar{display:flex;align-items:center;gap:8px;padding:6px 16px 12px}
.dash-overview{padding:0 16px 16px}
.dash-overview-inner{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dash-stat{background:rgba(255,255,255,0.55);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border:1px solid var(--border);border-radius:18px;padding:14px 10px;text-align:center}
.dash-stat .num{font-size:24px;font-weight:800;color:#5a3e2b;line-height:1.1}
.dash-stat .lbl{font-size:11px;color:var(--t2);margin-top:4px}
.dash-stat.warn .num{color:var(--danger)}
.dash-stat.ok .num{color:var(--green)}
.dash-clients{padding:0 16px 24px}

<script>
// ============================================================
// 数据层
// ============================================================
const SK = "video_ops_v3";
const DEFAULT_CHANNELS = [
  {id:"wx", name:"视频号"},
  {id:"dy", name:"抖音"},
  {id:"xhs", name:"小红书"},
  {id:"bili", name:"B站"}
];
const CLIENT_COLORS = ["#4f7cff","#7b5cff","#2bb673","#f5a623","#ff6b6b","#00b8d4","#ff8a3d","#e84aa1"];

let state = {
  clients: [],
  videos: [],
  settings: {
    publishInterval: 2,
    remindThreshold: 2,
    monthlyTarget: 15,
    apiKey: "",  // 旧字段保留兼容
    aiPlatform: "zhipu",
    zhipuKey: "",   // 智谱密钥
    deepseekKey: "", // DeepSeek密钥
    aicmKey: "",     // AICodeMirror密钥
    openaiKey: "",    // OpenAI密钥（Whisper语音转文字）
    openaiBaseUrl: "https://api.openai.com",  // OpenAI API地址（可改为中转平台）
    // 云端同步配置
    supabaseUrl: "https://ycehddktfdybwraweteu.supabase.co",
    supabaseKey: "sb_publishable_go9QTtxqiBYFmvs1Vglk9g_52Io8kGM",
    cloudSync: true,   // 是否开启云端同步
    lastSyncAt: 0      // 上次同步时间戳
  }
};
let currentClientId = null;
let calMonthOffset = 0;
let dashMonthOffset = 0;
let currentPage = "home";
let pageHistory = ["home"];

function load(){
  try{
    const s = localStorage.getItem(SK);
    if(s){
      const p = JSON.parse(s);
      state = {...state, ...p, settings:{...state.settings, ...(p.settings||{})}};
      // 兼容旧数据：给没有 channels 的 client 补默认渠道
      state.clients.forEach(c=>{
        if(!c.channels || c.channels.length===0){
          c.channels = DEFAULT_CHANNELS.map(ch=>({id:uid(), name:ch.name, url:""}));
        }
        // 给旧渠道补 url 字段
        c.channels.forEach(ch=>{ if(!ch.url) ch.url = ""; });
      });
      // 兼容旧 video：把 platforms 转成 channelStates
      state.videos.forEach(v=>{
        if(!v.channelStates){
          v.channelStates = {};
          // 旧数据迁移：尝试映射
          const client = state.clients.find(c=>c.id===v.clientId);
          if(client){
            client.channels.forEach((ch,i)=>{
              const oldKeys = ["wx","dy","xhs","bili"];
              const oldKey = oldKeys[i];
              v.channelStates[ch.id] = {
                selected: v.platforms && v.platforms[oldKey] || false,
                published: v.platforms && v.platforms[oldKey] || false,
                publishDate: (v.publishDates && v.publishDates[oldKey]) || ""
              };
            });
          }
          delete v.platforms;
          delete v.publishDates;
        }
        // 兼容旧数据：final 状态统一转成 pending
        if(v.status === "final") v.status = "pending";
      });
    } else {
      seedDemo();
    }
  }catch(e){console.error(e); seedDemo()}
  save();
  // 加载本地数据后，检查云端是否有更新
  const cfg = getSupabaseConfig();
  if(cfg.enabled && cfg.url && cfg.key){
    cloudPull(function(ok){
      if(!ok){
        // 云端没数据，把本地数据上传
        cloudFirstUpload();
      }
    });
  }
}
function save(){
  try{localStorage.setItem(SK, JSON.stringify(state))}catch(e){console.error(e)}
  cloudPushDebounced();
}

// ============================================================
// 云端同步（Supabase）
// ============================================================
let cloudSyncing = false; // 防止重复同步

function getSupabaseConfig(){
  const s = state.settings;
  return { url: s.supabaseUrl, key: s.supabaseKey, enabled: s.cloudSync };
}

// 推送数据到云端
function cloudPush(silent){
  const cfg = getSupabaseConfig();
  if(!cfg.enabled || !cfg.url || !cfg.key) return;
  if(cloudSyncing) return;
  cloudSyncing = true;
  const payload = {
    id: "main",
    data: JSON.stringify(state),
    updated_at: new Date().toISOString()
  };
  fetch(`${cfg.url}/rest/v1/workbench_data?id=eq.main`, {
    method: "PATCH",
    headers: {
      "apikey": cfg.key,
      "Authorization": `Bearer ${cfg.key}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    },
    body: JSON.stringify(payload)
  }).then(r => {
    if(!r.ok) throw new Error("HTTP "+r.status);
    state.settings.lastSyncAt = Date.now();
    localStorage.setItem(SK, JSON.stringify(state));
    if(!silent) showToast("已同步到云端 ✓");
  }).catch(e => {
    console.error("cloudPush error:", e);
    if(!silent) showToast("同步失败，稍后重试");
  }).finally(() => { cloudSyncing = false; });
}

// 从云端拉取数据
function cloudPull(callback){
  const cfg = getSupabaseConfig();
  if(!cfg.enabled || !cfg.url || !cfg.key){ callback && callback(false); return; }
  if(cloudSyncing){ callback && callback(false); return; }
  cloudSyncing = true;
  fetch(`${cfg.url}/rest/v1/workbench_data?id=eq.main&select=data,updated_at`, {
    method: "GET",
    headers: {
      "apikey": cfg.key,
      "Authorization": `Bearer ${cfg.key}`
    }
  }).then(r => {
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(arr => {
    if(arr && arr.length > 0 && arr[0].data){
      const cloudData = JSON.parse(arr[0].data);
      const cloudUpdated = new Date(arr[0].updated_at).getTime();
      const localUpdated = state.settings.lastSyncAt || 0;
      // 云端数据更新，拉取覆盖本地
      if(cloudUpdated > localUpdated){
        state = {...state, ...cloudData, settings:{...state.settings, ...(cloudData.settings||{}), lastSyncAt: cloudUpdated}};
        // 兼容迁移
        state.clients.forEach(c=>{
          if(!c.channels || c.channels.length===0){
            c.channels = DEFAULT_CHANNELS.map(ch=>({id:uid(), name:ch.name, url:""}));
          }
          c.channels.forEach(ch=>{ if(!ch.url) ch.url = ""; });
        });
        state.videos.forEach(v=>{
          if(!v.channelStates){
            v.channelStates = {};
            const client = state.clients.find(c=>c.id===v.clientId);
            if(client){
              client.channels.forEach((ch,i)=>{
                const oldKeys = ["wx","dy","xhs","bili"];
                v.channelStates[ch.id] = { selected:false, published:false, publishDate:"" };
              });
            }
          }
          // 兼容旧数据：final 状态统一转成 pending
          if(v.status === "final") v.status = "pending";
        });
        localStorage.setItem(SK, JSON.stringify(state));
        render();
        showToast("已从云端同步最新数据 ✓");
      }
      callback && callback(true);
    } else {
      callback && callback(false);
    }
  }).catch(e => {
    console.error("cloudPull error:", e);
    callback && callback(false);
  }).finally(() => { cloudSyncing = false; });
}

// 首次上传（如果云端没有数据）
function cloudFirstUpload(callback){
  const cfg = getSupabaseConfig();
  if(!cfg.enabled || !cfg.url || !cfg.key){ callback && callback(false); return; }
  fetch(`${cfg.url}/rest/v1/workbench_data?id=eq.main&select=id`, {
    method: "GET",
    headers: { "apikey": cfg.key, "Authorization": `Bearer ${cfg.key}` }
  }).then(r => r.json()).then(arr => {
    if(!arr || arr.length === 0){
      // 云端没数据，上传本地
      const payload = { id:"main", data: JSON.stringify(state), updated_at: new Date().toISOString() };
      return fetch(`${cfg.url}/rest/v1/workbench_data`, {
        method: "POST",
        headers: {
          "apikey": cfg.key,
          "Authorization": `Bearer ${cfg.key}`,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(payload)
      });
    }
  }).then(() => {
    state.settings.lastSyncAt = Date.now();
    localStorage.setItem(SK, JSON.stringify(state));
    callback && callback(true);
  }).catch(e => {
    console.error("cloudFirstUpload error:", e);
    callback && callback(false);
  });
}

// 带防抖的自动推送（每次 save 后延迟 2 秒再推，避免频繁请求）
let cloudPushTimer = null;
function cloudPushDebounced(){
  const cfg = getSupabaseConfig();
  if(!cfg.enabled) return;
  if(cloudPushTimer) clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(() => { cloudPush(true); }, 2000);
}

function seedDemo(){
  const c1 = uid(), c2 = uid(), c3 = uid();
  state.clients = [
    {id:c1, name:"美妆品牌A", color:CLIENT_COLORS[0], channels:DEFAULT_CHANNELS.map(ch=>({id:uid(),name:ch.name})), createdAt:Date.now()},
    {id:c2, name:"餐饮店B", color:CLIENT_COLORS[1], channels:DEFAULT_CHANNELS.map(ch=>({id:uid(),name:ch.name})), createdAt:Date.now()},
    {id:c3, name:"健身房C", color:CLIENT_COLORS[2], channels:[
      {id:uid(), name:"工作视频号"},
      {id:uid(), name:"生活视频号"},
      {id:uid(), name:"工作抖音"},
      {id:uid(), name:"小红书"},
    ], createdAt:Date.now()},
  ];
  const t = new Date();
  const addDays = n => { const d=new Date(t); d.setDate(d.getDate()+n); return dayStr(d); };
  const today = todayStr();

  // 辅助：生成 channelStates
  function cs(clientId, selectedMap){
    const client = state.clients.find(c=>c.id===clientId);
    const result = {};
    client.channels.forEach(ch=>{
      const s = selectedMap[ch.name] || selectedMap[ch.id];
      // 默认全选；只有显式 false 才不选
      const selected = s === false ? false : true;
      result[ch.id] = {
        selected: selected,
        published: s === "done" || s === "pending",
        publishDate: s === "done" || s === "pending" ? today : ""
      };
    });
    return result;
  }

  state.videos = [
    {id:uid(), clientId:c1, title:"夏季新品口红试色", status:"editing", scheduledDate:"", channelStates:cs(c1,{}), note:"客户要求加产品特写", createdAt:Date.now()},
    {id:uid(), clientId:c1, title:"618促销预告", status:"pending", scheduledDate:"", channelStates:cs(c1,{}), note:"", createdAt:Date.now()},
    {id:uid(), clientId:c1, title:"品牌故事长视频", status:"pending", scheduledDate:addDays(1), channelStates:cs(c1,{"视频号":"done","抖音":"done","小红书":"done","B站":"pending"}), note:"", createdAt:Date.now()},
    {id:uid(), clientId:c1, title:"618大促战报", status:"published", scheduledDate:addDays(-2), channelStates:cs(c1,{"视频号":"done","抖音":"done","小红书":"done","B站":"done"}), note:"", createdAt:Date.now()},
    
    {id:uid(), clientId:c2, title:"新品菜单试吃", status:"pending", scheduledDate:"", channelStates:cs(c2,{}), note:"", createdAt:Date.now()},
    {id:uid(), clientId:c2, title:"周末探店vlog", status:"pending", scheduledDate:addDays(3), channelStates:cs(c2,{"视频号":"pending","抖音":"pending","小红书":"pending","B站":"pending"}), note:"", createdAt:Date.now()},
    
    {id:uid(), clientId:c3, title:"健身教程-核心训练", status:"editing", scheduledDate:"", channelStates:cs(c3,{}), note:"等剪辑加字幕", createdAt:Date.now()},
    {id:uid(), clientId:c3, title:"私教课推广", status:"pending", scheduledDate:"", channelStates:cs(c3,{"工作视频号":"pending","工作抖音":"pending","小红书":"pending"}), note:"只发工作号，不发生活号", createdAt:Date.now()},
  ];
  save();
}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

// ============================================================
// 日期工具
// ============================================================
function dayStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`}
function todayStr(){return dayStr(new Date())}
function dayNum(s){const[y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000)}
function todayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function formatDate(s){
  if(!s) return "未排期";
  const diff = dayNum(s) - todayNum();
  if(diff===0) return "今天";
  if(diff===1) return "明天";
  if(diff===-1) return "昨天";
  if(diff>0 && diff<=7) return `${diff}天后`;
  const[y,m,d]=s.split('-').map(Number);
  return `${m}月${d}日`;
}
function getDow(s){const[y,m,d]=s.split('-').map(Number);return["周日","周一","周二","周三","周四","周五","周六"][new Date(y,m-1,d).getDay()]}
function isToday(s){return s===todayStr()}
function isOverdue(s){return s && s<todayStr()}
function isThisMonth(s){if(!s)return false;const d=new Date(s+"T00:00:00");const n=new Date();return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth()}

// ============================================================
// 业务计算
// ============================================================
function clientVideos(cid){return state.videos.filter(v=>v.clientId===cid)}
function clientStock(cid){return clientVideos(cid).filter(v=>v.status!=="published").length}
function clientPublishedThisMonth(cid){
  return clientVideos(cid).filter(v=>v.status==="published" && v.scheduledDate && isThisMonth(v.scheduledDate)).length;
}
function clientAlertClients(){return state.clients.filter(c=>clientStock(c.id) <= state.settings.remindThreshold)}

// 渠道相关
function getChannelName(clientId, channelId){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c) return "未知渠道";
  const ch = c.channels.find(x=>x.id===channelId);
  return ch ? ch.name : "已删除渠道";
}
function videoSelectedChannels(v){
  // 返回该视频选中的渠道
  return Object.entries(v.channelStates || {})
    .filter(([id,s])=>s.selected)
    .map(([id,s])=>({id, ...s, name:getChannelName(v.clientId, id)}));
}
function videoPublishedCount(v){
  return Object.values(v.channelStates || {}).filter(s=>s.selected && s.published).length;
}
function videoSelectedCount(v){
  return Object.values(v.channelStates || {}).filter(s=>s.selected).length;
}
function isVideoFullyPublished(v){
  const sel = videoSelectedChannels(v);
  return sel.length > 0 && sel.every(s=>s.published);
}

function switchPage(page, pushHistory=true){
  if(pushHistory && currentPage!==page) pageHistory.push(page);
  currentPage = page;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+page).classList.add("active");
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelector(`.nav-item[data-page="${page}"]`)?.classList.add("active");
  
  const titles = {home:"运营工作台", client:"", calendar:"发布日历", clients:"客户管理", dashboard:"数据看板"};
  document.getElementById("pageTitle").textContent = titles[page] || "运营工作台";
  
  const showBack = page !== "home" && page !== "calendar" && page !== "clients" && page !== "dashboard";
  document.getElementById("backBtn").style.display = showBack ? "flex" : "none";
  
  if(page === "home"){
    const n = new Date();
    const dows = ["周日","周一","周二","周三","周四","周五","周六"];
    document.getElementById("headerSub").textContent = `${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} ${dows[n.getDay()]}`;
  } else if(page === "clients"){
    document.getElementById("headerSub").textContent = `${state.clients.length} 个客户`;
  } else {
    document.getElementById("headerSub").textContent = "";
  }
  document.getElementById("content").scrollTop = 0;
  render();
}

function openClient(cid){
  currentClientId = cid;
  pageHistory.push("client");
  currentPage = "client";
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-client").classList.add("active");
  document.getElementById("backBtn").style.display = "flex";
  const c = state.clients.find(x=>x.id===cid);
  document.getElementById("pageTitle").textContent = c ? c.name : "";
  document.getElementById("headerSub").textContent = c ? `存货 ${clientStock(cid)} 条 · 本月已发 ${clientPublishedThisMonth(cid)} 条 · ${c.channels.length} 个渠道` : "";
  document.getElementById("content").scrollTop = 0;
  render();
}

function goBack(){
  pageHistory.pop();
  const prev = pageHistory[pageHistory.length-1] || "home";
  if(prev === "client" && currentClientId){
    pageHistory.pop();
    openClient(currentClientId);
  } else {
    switchPage(prev, false);
  }
}

function onFabClick(){
  if(currentPage === "client" && currentClientId){
    openVideoModal();
  } else if(currentPage === "home" || currentPage === "clients"){
    openClientModal();
  } else {
    showToast("在此页面暂无新增");
  }
}

// 背景图
function renderBackground(){
  const img = localStorage.getItem("bg_image");
  if(img){
    document.body.classList.add("has-bg");
    document.body.style.setProperty("--bg-image", `url(${img})`);
    document.body.querySelector("::before");
    // 直接设置 ::before 的背景
    const style = document.getElementById("bgStyle") || (()=>{
      const s = document.createElement("style");
      s.id = "bgStyle";
      document.head.appendChild(s);
      return s;
    })();
    style.textContent = `body.has-bg::before{background-image:url(${img})}`;
  } else {
    document.body.classList.remove("has-bg");
    const s = document.getElementById("bgStyle");
    if(s) s.textContent = "";
  }
}

function changeBackground(){
  const choice = confirm("设置背景图：\n\n「确定」= 从相册选图\n「取消」= 清除背景图");
  if(choice){
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.onchange = e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          const canvas = document.createElement("canvas");
          const maxW = 800;
          let w = img.width, h = img.height;
          if(w > maxW){ h = h * maxW / w; w = maxW; }
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL("image/jpeg", 0.8);
          localStorage.setItem("bg_image", compressed);
          renderBackground();
          showToast("背景图已设置 ✓");
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
    input.click();
  } else {
    localStorage.removeItem("bg_image");
    renderBackground();
    showToast("已清除背景图");
  }
}

// ============================================================
function renderCalendar(){
  const now = new Date();
  const viewDate = new Date(now.getFullYear(), now.getMonth()+calMonthOffset, 1);
  const y = viewDate.getFullYear(), m = viewDate.getMonth();
  document.getElementById("calMonth").textContent = `${y}年${m+1}月`;
  
  const firstDow = (new Date(y, m, 1).getDay() + 6) % 7; // 周一为首
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = todayStr();
  
  // 按日期聚合所有有排期的视频（包括渠道级排期）
  const tasksByDate = {};
  state.videos.forEach(v=>{
    // 视频整体排期
    if(v.scheduledDate && v.scheduledDate.startsWith(`${y}-${String(m+1).padStart(2,"0")}`)){
      if(!tasksByDate[v.scheduledDate]) tasksByDate[v.scheduledDate] = [];
      tasksByDate[v.scheduledDate].push({video:v, channel:null});
    }
    // 渠道级排期
    const selChs = videoSelectedChannels(v);
    selChs.forEach(s=>{
      if(s.publishDate && s.publishDate.startsWith(`${y}-${String(m+1).padStart(2,"0")}`) && s.publishDate !== v.scheduledDate){
        if(!tasksByDate[s.publishDate]) tasksByDate[s.publishDate] = [];
        tasksByDate[s.publishDate].push({video:v, channel:s});
      }
    });
  });
  
  const dows = ["一","二","三","四","五","六","日"];
  let html = dows.map(d=>`<div class="cgd-dow">${d}</div>`).join("");
  for(let i=0;i<firstDow;i++) html += `<div class="cal-cell empty"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const tasks = tasksByDate[ds];
    const isTodayFlag = ds === today;
    const isPast = ds < today;
    const cls = [isTodayFlag?"today":"", isPast?"past":"", tasks?"has-video":""].filter(Boolean).join(" ");
    const vidsHTML = tasks ? tasks.map(t=>{
      const c = state.clients.find(x=>x.id===t.video.clientId);
      const col = c ? c.color : "#999";
      const chName = t.channel ? t.channel.name : "";
      const isPub = t.video.status === "published" || (t.channel && t.channel.published);
      return `<div class="cal-video ${isPub?"published":""}" style="background:${hexToRgba(col,0.18)};border-left:2px solid ${col}" onclick="event.stopPropagation();openVideoModal('${t.video.id}')">
        ${chName ? `<span class="cv-client">${esc(c?c.name:"")} · ${esc(chName)}</span>` : `<span class="cv-client">${esc(c?c.name:"")}</span>`}
        ${esc(t.video.title)}
      </div>`;
    }).join("") : "";
    html += `<div class="cal-cell ${cls}" data-date="${ds}" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'${ds}')" onclick="onCalendarDayClick('${ds}')">
      <div class="cal-cell-date">${d}</div>
      ${vidsHTML}
    </div>`;
  }
  document.getElementById("calGrid").innerHTML = html;
  
  // 渲染视频侧栏
  renderVideoSidebar();
  // 渲染未排期提醒
  renderUnscheduledAlert();
}

function hexToRgba(hex, a){
  const h = hex.replace("#","");
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

function onCalendarDayClick(ds){
  const tasks = [];
  state.videos.forEach(v=>{
    if(v.scheduledDate === ds) tasks.push(v);
    Object.values(v.channelStates||{}).forEach(s=>{
      if(s.selected && s.publishDate === ds && s.publishDate !== v.scheduledDate) tasks.push(v);
    });
  });
  if(tasks.length === 0){showToast(ds + " 没有发布任务")}
}

let dragVideoId = null;
let touchDragGhost = null;
let touchDragging = false;

// 电脑拖拽
function onDragStart(e, vid){
  dragVideoId = vid;
  e.dataTransfer.effectAllowed = "move";
  e.target.classList.add("dragging");
  const v = state.videos.find(x=>x.id===vid);
  if(v){
    const ghost = document.createElement("div");
    ghost.textContent = v.title;
    ghost.style.cssText = "position:absolute;top:-100px;background:rgba(255,255,255,0.9);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;border:1px solid #9b7bd4";
    document.body.appendChild(ghost);
    e.dataTransfer.setDragImage(ghost, 20, 15);
    setTimeout(()=>ghost.remove(), 0);
  }
}
function onDragOver(e){
  e.preventDefault();
  e.currentTarget.classList.add("drag-over");
}
function onDragLeave(e){
  e.currentTarget.classList.remove("drag-over");
}
function onDrop(e, date){
  e.preventDefault();
  e.currentTarget.classList.remove("drag-over");
  document.querySelectorAll(".video-chip.dragging").forEach(el=>el.classList.remove("dragging"));
  if(dragVideoId) doSchedule(dragVideoId, date);
  dragVideoId = null;
}

// 手机触摸拖拽
function onTouchStartChip(e, vid){
  dragVideoId = vid;
  touchDragging = false;
  const touch = e.touches[0];
  // 记录起始位置
  window._touchStart = {x:touch.clientX, y:touch.clientY};
}

function onTouchMoveChip(e){
  if(!dragVideoId) return;
  const touch = e.touches[0];
  const start = window._touchStart;
  if(!start) return;
  
  const dx = Math.abs(touch.clientX - start.x);
  const dy = Math.abs(touch.clientY - start.y);
  
  // 移动超过5px才算拖拽开始
  if(!touchDragging && (dx > 5 || dy > 5)){
    touchDragging = true;
    e.preventDefault();
    // 创建跟随手指的幽灵
    if(touchDragGhost) touchDragGhost.remove();
    const v = state.videos.find(x=>x.id===dragVideoId);
    touchDragGhost = document.createElement("div");
    touchDragGhost.textContent = v ? v.title : "视频";
    touchDragGhost.style.cssText = "position:fixed;pointer-events:none;z-index:1000;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;color:#3d2e1f;border:2px solid #9b7bd4;box-shadow:0 8px 24px rgba(155,123,212,0.3);transform:rotate(-2deg);";
    document.body.appendChild(touchDragGhost);
  }
  
  if(touchDragging){
    e.preventDefault();
    if(touchDragGhost){
      touchDragGhost.style.left = (touch.clientX - 60) + "px";
      touchDragGhost.style.top = (touch.clientY - 20) + "px";
    }
    // 检测当前手指下方的日历格子
    document.querySelectorAll(".cal-cell.drag-over").forEach(el=>el.classList.remove("drag-over"));
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const cell = el?.closest(".cal-cell");
    if(cell && !cell.classList.contains("empty")){
      cell.classList.add("drag-over");
    }
  }
}

function onTouchEndChip(e){
  if(touchDragging && dragVideoId){
    const touch = e.changedTouches[0];
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    const cell = el?.closest(".cal-cell");
    if(cell && !cell.classList.contains("empty")){
      const date = cell.getAttribute("data-date");
      if(date) doSchedule(dragVideoId, date);
    }
  }
  
  document.querySelectorAll(".cal-cell.drag-over").forEach(el=>el.classList.remove("drag-over"));
  document.querySelectorAll(".video-chip.dragging").forEach(el=>el.classList.remove("dragging"));
  if(touchDragGhost){touchDragGhost.remove();touchDragGhost=null}
  dragVideoId = null;
  touchDragging = false;
  window._touchStart = null;
}

// 实际排期操作
function doSchedule(videoId, date){
  const v = state.videos.find(x=>x.id===videoId);
  if(!v) return;
  
  v.scheduledDate = date;
  
  const selChs = videoSelectedChannels(v);
  selChs.forEach(s=>{
    if(!s.publishDate){
      v.channelStates[s.id].publishDate = date;
    }
  });
  
  save();
  render();
  showToast(`已排期到 ${formatDate(date)}`);
  dragVideoId = null;
}

// 模拟排期（不实际修改数据）
function simulateAutoSchedule(){
  const unsched = state.videos.filter(v=>!v.scheduledDate && v.status==="pending");
  const today = new Date();
  today.setHours(0,0,0,0);
  
  // 建立已有排期映射：日期 → [{clientId, channelId}]
  const dateMap = {};
  state.videos.forEach(v=>{
    if(v.scheduledDate){
      if(!dateMap[v.scheduledDate]) dateMap[v.scheduledDate] = [];
      videoSelectedChannels(v).forEach(s=>{
        dateMap[v.scheduledDate].push({clientId:v.clientId, channelId:s.id});
      });
    }
    Object.entries(v.channelStates||{}).forEach(([cid,s])=>{
      if(s.selected && s.publishDate && s.publishDate !== v.scheduledDate){
        if(!dateMap[s.publishDate]) dateMap[s.publishDate] = [];
        dateMap[s.publishDate].push({clientId:v.clientId, channelId:cid});
      }
    });
  });
  
  const scheduled = [];
  const failedToSchedule = [];
  
  for(const v of unsched){
    const c = state.clients.find(x=>x.id===v.clientId);
    const selChs = videoSelectedChannels(v);
    if(selChs.length === 0){
      failedToSchedule.push({client:c?c.name:"", title:v.title, videoId:v.id, reason:"未选渠道"});
      continue;
    }
    let placed = false;
    
    // 从今天起往后找，最多找60天
    for(let i=0;i<60;i++){
      const tryDate = new Date(today);
      tryDate.setDate(tryDate.getDate()+i);
      const ds = dayStr(tryDate);
      const prevDate = new Date(tryDate);
      prevDate.setDate(prevDate.getDate()-1);
      const prevDs = dayStr(prevDate);
      
      // 检查每个选中渠道：
      // 1. 这个渠道今天是否已经排过（同一天同一渠道只能一条）
      // 2. 这个渠道昨天是否排过（不能连续两天）
      const todayUsed = (dateMap[ds]||[]).some(entry=>{
        return selChs.some(s=>entry.clientId===v.clientId && entry.channelId===s.id);
      });
      if(todayUsed) continue;
      
      const yesterdayUsed = (dateMap[prevDs]||[]).some(entry=>{
        return selChs.some(s=>entry.clientId===v.clientId && entry.channelId===s.id);
      });
      if(yesterdayUsed) continue;
      
      // 排到这天
      if(!dateMap[ds]) dateMap[ds] = [];
      selChs.forEach(s=>{
        dateMap[ds].push({clientId:v.clientId, channelId:s.id});
      });
      
      scheduled.push({
        videoId:v.id,
        date:formatDate(ds),
        ds:ds,
        client:c?c.name:"",
        title:v.title
      });
      placed = true;
      break;
    }
    
    if(!placed){
      failedToSchedule.push({client:c?c.name:"", title:v.title, videoId:v.id});
    }
  }
  
  return {scheduled, unscheduled:failedToSchedule};
}

// 排期前的快照，用于撤销
let autoScheduleSnapshot = null;

function confirmAutoSchedule(){
  // 保存排期前的状态快照
  autoScheduleSnapshot = JSON.parse(JSON.stringify({
    videos: state.videos,
    clients: state.clients
  }));
  
  const result = simulateAutoSchedule();
  
  // 实际写入排期
  result.scheduled.forEach(s=>{
    const v = state.videos.find(x=>x.id===s.videoId);
    if(v){
      v.scheduledDate = s.ds;
      // 给未设日期的渠道也设上
      Object.entries(v.channelStates||{}).forEach(([cid,st])=>{
        if(st.selected && !st.publishDate){
          st.publishDate = s.ds;
        }
      });
    }
  });
  
  save();
  render();
  closeAutoSchedule();
  
  const msg = result.unscheduled.length > 0
    ? `已排 ${result.scheduled.length} 个，${result.unscheduled.length} 个未排上`
    : `已排 ${result.scheduled.length} 个视频 🎉`;
  showToast(msg + ' · 点撤销可还原');
  
  // 3 秒内显示撤销按钮
  showUndoToast(msg);
}

function showUndoToast(msg){
  const toast = document.getElementById("toast");
  toast.innerHTML = `<span>${msg}</span> <button class="undo-btn" onclick="undoAutoSchedule()">撤销</button>`;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
    toast.innerHTML = "";
    autoScheduleSnapshot = null;
  }, 120000);
}

function undoAutoSchedule(){
  if(!autoScheduleSnapshot){
    showToast("已无法撤销");
    return;
  }
  state.videos = autoScheduleSnapshot.videos;
  state.clients = autoScheduleSnapshot.clients;
  save();
  render();
  autoScheduleSnapshot = null;
  
  // 关闭 toast
  const toast = document.getElementById("toast");
  toast.classList.remove("show");
  toast.innerHTML = "";
  
  showToast("已撤销排期 ✓");
}

function deleteChannel(chId){
  const c = state.clients.find(x=>x.id===currentClientId);
  if(!c) return;
  if(c.channels.length <= 1){showToast("至少保留 1 个渠道");return}
  // 检查是否有视频用到了这个渠道
  const usedCount = state.videos.filter(v=>v.clientId===currentClientId && v.channelStates && v.channelStates[chId] && v.channelStates[chId].selected).length;
  if(usedCount > 0){
    if(!confirm(`有 ${usedCount} 条视频选了这个渠道，删除后这些视频的该渠道发布记录也会删除。继续？`)) return;
    state.videos.forEach(v=>{
      if(v.clientId===currentClientId && v.channelStates && v.channelStates[chId]){
        delete v.channelStates[chId];
      }
    });
  }
  c.channels = c.channels.filter(x=>x.id!==chId);
  save();
  openChannelManager();
  showToast("已删除渠道");
}

function pickStatus(el){
  document.querySelectorAll("#statusRow .sel-btn").forEach(b=>b.classList.remove("active"));
  el.classList.add("active");
}

function clearVideoDate(){
  document.getElementById("vDate").value = "";
  // 同时清除渠道的日期
  document.querySelectorAll("#chChecks .ch-check .date-input").forEach(inp=>{ inp.value = ""; });
  document.querySelectorAll("#chChecks .ch-check .date").forEach(el=>{ el.textContent = "未发"; });
  showToast("已清除排期日期");
}

function toggleChannel(el){
  const active = el.classList.toggle("active");
  const box = el.querySelector(".box");
  if(active){
    box.textContent = "✓";
    // 添加日期输入框
    const existing = el.querySelector(".date-input");
    if(!existing){
      const dateInput = document.createElement("input");
      dateInput.type = "date";
      dateInput.className = "date-input";
      dateInput.value = todayStr();
      dateInput.onclick = (e)=>e.stopPropagation();
      dateInput.onchange = (e)=>{el.querySelector(".date").textContent = e.target.value || "未发"};
      el.appendChild(dateInput);
    }
    el.querySelector(".date").textContent = todayStr();
  } else {
    box.textContent = "";
    el.querySelector(".date").textContent = "未发";
    const di = el.querySelector(".date-input");
    if(di) di.remove();
  }
}

function updateChannelDate(chId, date){
  const el = document.querySelector(`.ch-check[data-ch-id="${chId}"]`);
  if(el){el.querySelector(".date").textContent = date || "未发"}
}

function onVideoClientChange(){
  // 切换客户时重新渲染渠道列表
  const newClientId = document.getElementById("vClient").value;
  if(!newClientId) return;
  const client = state.clients.find(x=>x.id===newClientId);
  if(!client) return;
  
  const chChecks = client.channels.map(ch=>{
    return `<div class="ch-check" data-ch-id="${ch.id}" onclick="toggleChannel(this)">
      <div class="box"></div>
      <div class="name">${esc(ch.name)}</div>
      <div class="date">未发</div>
    </div>`;
  }).join("");
  document.getElementById("chChecks").innerHTML = chChecks;
}

function saveVideo(){
  const title = document.getElementById("vTitle").value.trim();
  if(!title){showToast("请输入标题");return}
  const clientId = document.getElementById("vClient").value;
  if(!clientId){showToast("请选择客户");return}
  
  const client = state.clients.find(x=>x.id===clientId);
  if(!client){showToast("客户不存在");return}
  
  if(editingVideoId){
    // 编辑模式：收集所有字段
    const status = document.querySelector("#statusRow .sel-btn.active")?.dataset.status || "editing";
    const scheduledDate = document.getElementById("vDate").value;
    const note = document.getElementById("vNote").value.trim();
    
    const channelStates = {};
    document.querySelectorAll("#chChecks .ch-check").forEach(el=>{
      const chId = el.dataset.chId;
      const selected = el.classList.contains("active");
      const dateInput = el.querySelector(".date-input");
      // 渠道日期：如果渠道单独设了日期就用单独的，否则用排期日期
      let publishDate = "";
      if(selected){
        if(dateInput && dateInput.value){
          publishDate = dateInput.value;
        } else if(scheduledDate){
          publishDate = scheduledDate;
        }
      }
      channelStates[chId] = {
        selected: selected,
        published: selected && publishDate !== "",
        publishDate: publishDate
      };
    });
    
    const v = state.videos.find(x=>x.id===editingVideoId);
    if(v){
      v.title=title;v.clientId=clientId;v.status=status;v.scheduledDate=scheduledDate;v.note=note;
      v.channelStates = channelStates;
      if(isVideoFullyPublished(v) && status!=="published"){
        v.status = "published";
        showToast("所有渠道已发，自动标记为已发完 🎉");
      }
    }
  } else {
    // 新增模式：默认修改中状态，默认全选渠道
    const note = document.getElementById("vNote")?.value.trim() || "";
    const channelStates = {};
    client.channels.forEach(ch=>{
      channelStates[ch.id] = {selected:true, published:false, publishDate:""};
    });
    
    const v = {id:uid(),title,clientId,status:"editing",scheduledDate:"",channelStates,note,createdAt:Date.now()};
    state.videos.push(v);
  }
  
  save();
  closeModal();
  editingVideoId = null;
  render();
  showToast("已保存");
}

function handleAIFlowVideoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  aiFlowFileName = file.name;
  aiFlowMimeType = file.type || "video/mp4";
  const uploadEl = document.getElementById("aiFlowUpload");
  if(!uploadEl) return;
  uploadEl.classList.add("has-file");
  const fmtBadge = aiFlowMimeType.includes("mp4") ? "" : ` · ${aiFlowMimeType.split("/")[1]||"mov"}将自动转换`;
  document.getElementById("aiFlowUploadHint").innerHTML = `
    <div style="font-size:24px;margin-bottom:4px">✓</div>
    <b>${esc(file.name)}</b><br>
    <span style="font-size:11px">${(file.size/1024/1024).toFixed(1)} MB${fmtBadge}</span>
  `;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    aiFlowBase64 = ev.target.result.split(",")[1];
  };
  reader.readAsDataURL(file);
}

function showFlowProgress(html){
  const el = document.getElementById("aiFlowProgress");
  if(el){ el.style.display = "block"; el.innerHTML = html; }
}

function showFlowResult(html){

  if(el){ el.style.display = "block"; el.innerHTML = html; }
}

function showFlowActions(html){
  const el = document.getElementById("aiFlowActions");
  if(el){ el.style.display = "block"; el.innerHTML = html; }
}

function hideFlowUI(){
  const p = document.getElementById("aiFlowProgress");
