// ============================================================
// 生成文案（v27: 字幕为主，视频画面为辅）
// ============================================================
async function runAIGenerateFlow(){
  const subtitle = (document.getElementById("aiFlowSubtitle")?.value || "").trim();
  if(!subtitle){
    showToast("请先粘贴字幕内容");
    return;
  }
  if(subtitle.length < 10){
    showToast("字幕内容太短，至少10个字");
    return;
  }

  // 检查是否要用智谱
  const useZhipu = document.getElementById("aiFlowUseZhipu")?.checked && aiFlowBase64;
  if(useZhipu && !state.settings.zhipuKey){
    showToast("智谱 Key 未配置，将仅使用字幕生成");
  }

  // 隐藏开始按钮
  const startBtn = document.getElementById("aiFlowStartBtn");
  if(startBtn) startBtn.style.display = "none";
  hideFlowUI();

  let analysisText = "";
  let stepLabel = "";

  if(useZhipu && state.settings.zhipuKey){
    // 步骤1：智谱分析视频画面
    showFlowProgress(`
      <div class="ai-loading" style="padding:16px">
        <span>步骤 1/2 · 智谱正在分析视频画面...</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    `);

    const analysisPrompt = `分析这个视频，按以下格式输出：
1. 谁：（主角是谁，什么身份/职业/背景）
2. 在哪儿：（在哪个国家/城市/场景）
3. 干什么：（在做什么事，状态如何）
4. 细节：（2-3个关键画面或具体动作）
5. 情绪点：（最能打动人的一句话或一个瞬间）
每项1-2句话，不要啰嗦。`;

    const zhipuResult = await callZhipuVideoAPI(aiFlowBase64, analysisPrompt, aiFlowMimeType);

    if(zhipuResult){
      // 合并字幕和画面分析
      analysisText = `【视频画面分析】\n${zhipuResult}\n\n【视频字幕内容】\n${subtitle}`;
    } else {
      // 智谱失败，只用字幕
      analysisText = subtitle;
      showFlowProgress(`<div style="padding:8px;text-align:center;color:var(--orange);font-size:12px">智谱分析失败，将仅使用字幕生成文案</div>`);
    }
    stepLabel = "步骤 2/2";
  } else {
    // 纯字幕路线
    analysisText = subtitle;
    stepLabel = "正在";
  }

  // DeepSeek 生成3组文案
  showFlowProgress(`
    <div class="ai-loading" style="padding:16px">
      <span>${stepLabel} · DeepSeek 正在生成3组文案...</span>
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  `);

  const copyPrompt = buildCopyPrompt(analysisText, true);

  // 初始化对话历史
  aiFlowChatHistory = [
    {role: "user", content: copyPrompt}
  ];

  const copyResult = await callDeepSeekAPI(
    aiFlowChatHistory,
    state.settings.deepseekKey
  );

  // 把 AI 的回复加入历史
  if(copyResult){
    aiFlowChatHistory.push({role: "assistant", content: copyResult});
  }

  await handleCopyResult(copyResult, subtitle);
}

// ============================================================
// 公共：构建 DeepSeek prompt（3组风格）
// ============================================================
function buildCopyPrompt(analysisText, isTranscript){
  const contextLabel = isTranscript ? "用户提供的视频字幕/口播内容" : "视频分析结果";
  return `你是一个短视频文案专家。你的唯一任务：把用户给的聊天记录或口播内容，写成有温度、有人情味、像朋友聊天一样的短视频文案。

【你的工作方式】
- 你只写真实的东西，不编造、不夸大、不说套话
- 你的文字要有画面感，别人读的时候脑子里能出现那个场景
- 你的文字要有人物，让看的人感觉"这是一个人在说话"，而不是AI在写作文

【你必须避开的坑】
- 禁止用：家人们、谁懂啊、救命、点赞关注、宝藏、绝绝子、yyds
- 禁止用："她说..." 开头（不要每句都是"她说"）
- 禁止用："那一刻…只是…" 这个句式
- 禁止在结尾讲大道理（比如"告诉我们…"、"这让我想起…"）
- 禁止写成新闻稿、产品介绍、宣传文案

【你每输出一次，都要包含以下3组】

第一组 · 白描风
特点：不判断、不总结、不升华，只写"眼睛能看到的东西"
短版：
标题：一句话，15字以内，要有画面感
正文：只写动作、画面、场景，不加任何判断句
长版：
标题：一句话，20字以内
正文：3-4句，全部是连贯的场景描写，让画面自己说话

第二组 · 金句风
特点：前面叙事，最后落一句有温度、有力度的话，收在人物身上
短版：
标题：一句话，15字以内，要有态度
正文：1-2句，最后落在一句有温度的话上
长版：
标题：一句话，20字以内
正文：3-4句，前面叙事，最后一句收在人物感受或决定上

第三组 · 叙事风
特点：讲一个完整的小故事，有开始、有动作、有变化
短版：
标题：一句话，15字以内，写一个转折或瞬间
正文：一句话，写人物做了什么决定或发生了什么变化
长版：
标题：一句话，20字以内
正文：4-5句，完整讲一个段落：起因→做了什么→结果如何→人物变化

【这种写法才是对的（模仿这个风格）】
标题：在迪拜带女儿打拼的她，说了一句大实话
正文：一个人扛生活，认真又坚定。她说帮到别人比赚钱更踏实。

标题：下午三点，她在工地接客户电话
正文：戴安全帽，踩碎石，翻笔记本上的户型图。

标题：闺蜜一句话，她去了迪拜
正文：闺蜜说你去学房产吧。三年后，她成了帮人出海的桥梁。

标题：迪拜三年，她活成了自己的靠山
正文：没有退路，也从来不找退路。一个人带着女儿，把委屈咽下去，把日子撑起来。

【这种写法是错的（不要这样写）】
标题：迪拜单亲妈妈的一天（像新闻标题，没画面）
正文：她咽下委屈扛下压力，最终发现...（太空了，没具体场景）
标题：在迪拜，她为自己扎根（像口号，不像人在说话）

【每次输出前，你自己检查一遍】
- 标题是不是有画面感，而不只是在"概括主题"？
- 正文是不是像人在说话，而不是AI在写作文？
- 结尾是不是落在"这个人怎样了"，而不是落在一个道理上？
- 有没有出现上面"禁止用"的任何词或句式？
- 如果我读了开头，会不会想知道接下来发生了什么？

记住：你要写的不是"文案"，是"让看的人想点进去看的一个瞬间"。

【以下是${contextLabel}】
${analysisText}

【输出要求（极其重要）】
必须输出一个JSON对象，包含groups数组，每组有name, shortTitle, shortBody, longTitle, longBody：
{"groups":[{"name":"白描风","shortTitle":"","shortBody":"","longTitle":"","longBody":""},{"name":"金句风","shortTitle":"","shortBody":"","longTitle":"","longBody":""},{"name":"叙事风","shortTitle":"","shortBody":"","longTitle":"","longBody":""}]}

只输出这一个JSON，不要加任何解释文字、markdown标记。`;
}

// ============================================================
// 公共：处理 DeepSeek 返回结果（解析+展示）
// ============================================================
async function handleCopyResult(copyResult, fallbackText){
  if(!copyResult){
    showFlowProgress(`<div style="padding:14px;text-align:center;color:var(--danger);font-size:13px">文案生成失败，请检查 DeepSeek 密钥</div>`);
    showFlowActions(`
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="retryFlow()">🔄 重新选择</button>
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>
      </div>
    `);
    return;
  }

  // 解析结果
  const parsed = parseCopyResult(copyResult);
  if(!parsed || !parsed.groups || parsed.groups.length === 0){
    // 解析失败，显示原始输出
    showFlowProgress(`<div style="padding:8px;text-align:center;color:var(--danger);font-size:13px;font-weight:600">文案格式解析失败</div>`);
    let fallbackHtml = `
      <div style="margin-top:10px">
        <div style="font-size:12px;color:var(--t2);margin-bottom:6px">DeepSeek 原始输出（你可以手动复制）：</div>
        <div style="background:var(--bg);border-radius:10px;padding:10px;font-size:13px;color:var(--t3);line-height:1.6;white-space:pre-wrap;max-height:300px;overflow-y:auto">${esc(copyResult)}</div>
    `;
    if(fallbackText){
      fallbackHtml += `
        <div style="font-size:12px;color:var(--t2);margin:10px 0 6px">语音转文字结果：</div>
        <div style="background:var(--bg);border-radius:10px;padding:10px;font-size:13px;color:var(--t3);line-height:1.6;white-space:pre-wrap;max-height:200px;overflow-y:auto">${esc(fallbackText)}</div>
      `;
    }
    fallbackHtml += `</div>`;
    showFlowResult(fallbackHtml);
    showFlowActions(`
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1" onclick="retryFlow()">🔄 重新选择</button>
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">关闭</button>
      </div>
    `);
    return;
  }

  aiFlowResultData = parsed;

  // 显示结果
  showFlowProgress(`<div style="padding:8px;text-align:center;color:var(--green);font-size:13px;font-weight:600">✓ 生成完成 · ${parsed.groups.length}组文案</div>`);

  // 渲染3组文案
  let groupsHtml = '<div style="margin-top:10px">';
  parsed.groups.forEach((g, i) => {
    const color = GROUP_COLORS[i % GROUP_COLORS.length];
    groupsHtml += `
      <div style="background:var(--bg);border-radius:12px;padding:12px;margin-bottom:10px;border-left:3px solid ${color}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <b style="font-size:13px;color:${color}">组${i+1} · ${esc(g.name)}</b>
          <button class="ai-gen-btn secondary" style="font-size:11px;padding:4px 10px" onclick="copyFlowGroup(${i})">📋 复制</button>
        </div>
        <div style="margin-bottom:8px">
          <div style="font-size:11px;color:var(--t3);margin-bottom:2px">短版</div>
          <div style="font-size:14px;font-weight:700;color:#5a3e2b;margin-bottom:2px">${esc(g.shortTitle)}</div>
          <div style="font-size:13px;color:var(--t3);line-height:1.6">${esc(g.shortBody)}</div>
        </div>
        <div>
          <div style="font-size:11px;color:var(--t3);margin-bottom:2px">长版</div>
          <div style="font-size:14px;font-weight:700;color:#5a3e2b;margin-bottom:2px">${esc(g.longTitle)}</div>
          <div style="font-size:13px;color:var(--t3);line-height:1.6">${esc(g.longBody)}</div>
        </div>
      </div>
    `;
  });
  groupsHtml += '</div>';

  // 追问输入框
  groupsHtml += `
    <div style="margin-top:12px;background:rgba(79,124,255,0.06);border:1px solid rgba(79,124,255,0.15);border-radius:12px;padding:12px">
      <div style="font-size:12px;font-weight:600;color:#4f7cff;margin-bottom:6px">💬 追问修改</div>
      <textarea id="aiFlowRefineInput" class="fi" style="min-height:60px;resize:vertical;font-size:13px;line-height:1.5" placeholder="告诉AI哪里不满意...&#10;例如：标题太平了，改得更有画面感&#10;例如：第二组结尾换一种说法"></textarea>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-secondary" style="flex:1" onclick="retryFlow()">🔄 重新生成</button>
        <button class="btn btn-primary" style="flex:1" onclick="fillAIGenerateResult()">填入视频</button>
      </div>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px" id="aiFlowRefineBtn" onclick="refineCopy()">✏️ 追问修改</button>
      <button class="btn btn-secondary" style="width:100%;margin-top:8px" onclick="closeModal()">关闭</button>
    </div>
  `;

  showFlowResult(groupsHtml);
}

// ============================================================
// 追问修改（多轮对话）
// ============================================================
async function refineCopy(){
  const inputEl = document.getElementById("aiFlowRefineInput");
  if(!inputEl) return;
  const userMessage = inputEl.value.trim();
  if(!userMessage){
    showToast("请输入修改要求");
    return;
  }
  if(aiFlowChatHistory.length === 0){
    showToast("请先生成文案");
    return;
  }

  // 把用户的追问加入历史
  const refinePrompt = userMessage + `\n\n（请基于上一轮生成的文案，只修改我指出的部分，其他保持不变。仍然输出完整的3组JSON，格式和之前一样：{"groups":[{"name":"","shortTitle":"","shortBody":"","longTitle":"","longBody":""},...]}。只输出JSON，不要加解释。）`;
  aiFlowChatHistory.push({role: "user", content: refinePrompt});

  // 禁用输入框和按钮
  inputEl.disabled = true;
  const btn = document.getElementById("aiFlowRefineBtn");
  if(btn){ btn.disabled = true; btn.textContent = "正在修改..."; }

  // 显示进度（在结果区域上方）
  const progressEl = document.getElementById("aiFlowProgress");
  if(progressEl){
    progressEl.style.display = "block";
    progressEl.innerHTML = `
      <div class="ai-loading" style="padding:12px">
        <span>DeepSeek 正在修改文案...</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    `;
  }

  // 调用 DeepSeek（传入完整对话历史）
  const copyResult = await callDeepSeekAPI(
    aiFlowChatHistory,
    state.settings.deepseekKey
  );

  // 恢复输入框和按钮
  inputEl.disabled = false;
  if(btn){ btn.disabled = false; btn.textContent = "✏️ 追问修改"; }

  if(!copyResult){
    if(progressEl){
      progressEl.innerHTML = `<div style="padding:8px;text-align:center;color:var(--danger);font-size:13px">修改失败，请重试</div>`;
    }
    // 移除刚才加的历史
    aiFlowChatHistory.pop();
    return;
  }

  // 把 AI 回复加入历史
  aiFlowChatHistory.push({role: "assistant", content: copyResult});

  // 隐藏进度
  if(progressEl) progressEl.style.display = "none";

  // 解析新结果
  const parsed = parseCopyResult(copyResult);
  if(!parsed || !parsed.groups || parsed.groups.length === 0){
    // 解析失败，保留旧结果，提示用户
    showToast("AI返回格式异常，请换个说法再试");
    // 移除刚才加的历史
    aiFlowChatHistory.pop();
    return;
  }

  aiFlowResultData = parsed;
  inputEl.value = ""; // 清空输入框

  // 重新渲染结果（保留追问框）
  let groupsHtml = '<div style="margin-top:10px">';
  // 修改提示
  groupsHtml += `<div style="padding:6px 10px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:12px;color:var(--green);margin-bottom:10px;text-align:center">✓ 已修改 · 第${Math.floor(aiFlowChatHistory.length/2)}轮</div>`;

  parsed.groups.forEach((g, i) => {
    const color = GROUP_COLORS[i % GROUP_COLORS.length];
    groupsHtml += `

// ============================================================
// 解析 DeepSeek 返回（支持3组格式 + 向后兼容）
// ============================================================
function parseCopyResult(text){
  if(!text) return null;
  let cleaned = text.trim();
  cleaned = cleaned.replace(/```(?:json)?\s*/g, "").replace(/```\s*/g, "").trim();

  // 方案1：整体 JSON.parse
  try{
    const obj = JSON.parse(cleaned);
    if(obj && typeof obj === "object"){
      // 新格式：有 groups 数组
      if(obj.groups && Array.isArray(obj.groups) && obj.groups.length > 0){
        return { groups: normalizeCopyGroups(obj.groups) };
      }
      // 旧格式：扁平对象
      const legacy = normalizeCopyObj(obj);
      if(legacy) return legacyToGroups(legacy);
    }
  }catch(e){ /* 不是单个 JSON，继续 */ }

  // 方案2：提取 JSON 块
  try{
    const blocks = extractJsonBlocks(cleaned);
    if(blocks.length >= 1){
      // 尝试第一个块
      const obj1 = JSON.parse(blocks[0]);
      if(obj1.groups && Array.isArray(obj1.groups)){
        return { groups: normalizeCopyGroups(obj1.groups) };
      }
      // 多块合并（旧格式兼容）
      if(blocks.length >= 2){
        const obj2 = JSON.parse(blocks[1]);
        const merged = {};
        merged.shortTitle = obj1.shortTitle || obj1.title || "";
        merged.shortBody = obj1.shortBody || obj1.body || obj1.content || "";
        merged.longTitle = obj2.longTitle || obj2.title || obj1.longTitle || "";
        merged.longBody = obj2.longBody || obj2.body || obj2.content || obj2.shortBody || "";
        if(!merged.longTitle && obj1.longTitle) merged.longTitle = obj1.longTitle;
        if(!merged.longBody && obj1.longBody) merged.longBody = obj1.longBody;
        if(merged.shortTitle || merged.shortBody || merged.longTitle || merged.longBody){
          return legacyToGroups(merged);
        }
      }
      // 单块旧格式
      const legacy = normalizeCopyObj(obj1);
      if(legacy) return legacyToGroups(legacy);
    }
  }catch(e){ /* JSON 提取失败，走方案3 */ }

  // 方案3：纯文本提取（按"组N · 风格名"标记解析）
  const groups = parseTextGroups(cleaned);
  if(groups && groups.length > 0){
    return { groups: normalizeCopyGroups(groups) };
  }

  // 方案4：旧格式文本提取（短版/长版标记）
  const legacyText = parseLegacyText(cleaned);
  if(legacyText){
    return legacyToGroups(legacyText);
  }

  // 方案5：兜底 - 整体当一个组
  if(cleaned.length > 5){
    const firstLine = cleaned.split("\n").find(l=>l.trim().length > 0) || "";
    return legacyToGroups({
      shortTitle: firstLine.substring(0, 20),
      shortBody: cleaned,
      longTitle: firstLine.substring(0, 30),
      longBody: cleaned
    });
  }

  console.error("parseCopyResult: all methods failed, raw:", text.substring(0, 300));
  return null;
}

// 解析"组N · 风格名"格式的纯文本
function parseTextGroups(text){
  const lines = text.split("\n");
  const groups = [];
  let currentGroup = null;
  let mode = ""; // "short" | "long"

  for(let i=0; i<lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;

    // 检测"组N · 风格名"
    const groupMatch = line.match(/^组\s*(\d+)\s*[·•]\s*(.+)/);
    if(groupMatch){
      if(currentGroup) groups.push(currentGroup);
      currentGroup = { name: groupMatch[2].trim(), shortTitle:"", shortBody:"", longTitle:"", longBody:"" };
      mode = "";
      continue;
    }

    if(!currentGroup) continue;

    // 检测短版/长版标记
    if(line.match(/^短版[:：]/)){
      mode = "short";
      const after = line.replace(/^短版[:：]\s*/, "");
      if(after && after.length < 30 && !after.match(/^(标题|正文)/)) currentGroup.shortTitle = after;
      continue;
    }
    if(line.match(/^长版[:：]/)){
      mode = "long";
      const after = line.replace(/^长版[:：]\s*/, "");
      if(after && after.length < 40 && !after.match(/^(标题|正文)/)) currentGroup.longTitle = after;
      continue;
    }

    // 检测标题/正文标记
    if(line.match(/^标题[:：]/)){
      const val = line.replace(/^标题[:：]\s*/, "");
      if(mode === "long") currentGroup.longTitle = val;
      else currentGroup.shortTitle = val;
      continue;
    }
    if(line.match(/^正文[:：]/)){
      const val = line.replace(/^正文[:：]\s*/, "");
      if(mode === "long") currentGroup.longBody = val;
      else if(mode === "short") currentGroup.shortBody = val;
      continue;
    }

    // 纯文本行
    if(mode === "short"){
      if(!currentGroup.shortTitle && line.length <= 20) currentGroup.shortTitle = line;
      else currentGroup.shortBody = currentGroup.shortBody ? currentGroup.shortBody + line : line;
    } else if(mode === "long"){
      if(!currentGroup.longTitle && line.length <= 30) currentGroup.longTitle = line;
      else currentGroup.longBody = currentGroup.longBody ? currentGroup.longBody + line : line;
    }
  }
  if(currentGroup) groups.push(currentGroup);
  return groups.length > 0 ? groups : null;
}

// 旧格式纯文本提取
function parseLegacyText(cleaned){
  const lines = cleaned.split("\n");
  let shortTitle = "", shortBody = "", longTitle = "", longBody = "";
  let mode = "";

  for(let i=0; i<lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;

    if(line.match(/^(短版|短文案|##\s*短版)/)){
      mode = "short";
      const afterColon = line.replace(/^(短版|短文案|##\s*短版)[:：\s]*/, "");
      if(afterColon && afterColon.length < 30) shortTitle = afterColon;
      continue;
    }
    if(line.match(/^(长版|长文案|##\s*长版)/)){
      mode = "long";
      const afterColon = line.replace(/^(长版|长文案|##\s*长版)[:：\s]*/, "");
      if(afterColon && afterColon.length < 40) longTitle = afterColon;
      continue;
    }
    if(line.match(/^(标题|短标题|长标题)[:：]/)){
      const val = line.replace(/^(标题|短标题|长标题)[:：]\s*/, "");
      if(mode === "long" || line.startsWith("长标题")) longTitle = val;
      else if(mode === "short" || line.startsWith("短标题")) shortTitle = val;
      else shortTitle = val;
      continue;
    }
    if(line.match(/^(正文|内容|文案)[:：]/)){
      const val = line.replace(/^(正文|内容|文案)[:：]\s*/, "");
      if(mode === "long") longBody = val;
      else if(mode === "short") shortBody = val;
      continue;
    }
    if(mode === "short"){
      if(!shortTitle && line.length <= 20) shortTitle = line;
      else shortBody = shortBody ? shortBody + line : line;
    } else if(mode === "long"){
      if(!longTitle && line.length <= 30) longTitle = line;
      else longBody = longBody ? longBody + line : line;
    }
  }

  if(shortTitle || shortBody || longTitle || longBody){
    return {
      shortTitle: shortTitle || "",
      shortBody: shortBody || "",
      longTitle: longTitle || shortTitle || "",
      longBody: longBody || shortBody || ""
    };
  }
  return null;
}

// 标准化 groups 数组
function normalizeCopyGroups(arr){
  if(!Array.isArray(arr)) return [];
  return arr.map(g => ({
    name: String(g.name || "默认风格"),
    shortTitle: String(g.shortTitle || g.title || g.short_title || ""),
    shortBody: String(g.shortBody || g.body || g.content || g.short_body || ""),
    longTitle: String(g.longTitle || g.long_title || g.title || ""),
    longBody: String(g.longBody || g.long_body || g.body || g.content || "")
  }));
}

// 旧格式转 groups 格式
function legacyToGroups(legacy){
  if(!legacy) return null;
  return {
    groups: [{
      name: "默认风格",
      shortTitle: String(legacy.shortTitle || ""),
      shortBody: String(legacy.shortBody || ""),
      longTitle: String(legacy.longTitle || legacy.shortTitle || ""),
      longBody: String(legacy.longBody || legacy.shortBody || "")
    }]
  };
}

// 提取文本中所有顶层 {...} JSON 块
function extractJsonBlocks(text){
  const blocks = [];
  let i = 0;
  while(i < text.length){
    if(text[i] === "{"){
      let depth = 0;
      let start = i;
      let inString = false;
      let escape = false;
      while(i < text.length){
        const ch = text[i];
        if(escape){ escape = false; i++; continue; }
        if(ch === "\\"){ escape = true; i++; continue; }
        if(ch === '"'){ inString = !inString; i++; continue; }
        if(inString){ i++; continue; }
        if(ch === "{") depth++;
        if(ch === "}"){
          depth--;
          if(depth === 0){
            blocks.push(text.substring(start, i + 1));
            break;
          }
        }
        i++;
      }
    }
    i++;
  }
  return blocks;
}

// 标准化单个 JSON 对象为文案结果（旧格式兼容）
function normalizeCopyObj(obj){
  if(!obj || typeof obj !== "object") return null;
  return {
    shortTitle: String(obj.shortTitle || obj.title || obj.short_title || ""),
    shortBody: String(obj.shortBody || obj.body || obj.content || obj.short_body || ""),
    longTitle: String(obj.longTitle || obj.long_title || obj.title || ""),
    longBody: String(obj.longBody || obj.long_body || obj.body || obj.content || "")
  };
}

function copyText(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); showToast("已复制"); }catch(e){ showToast("复制失败"); }
  document.body.removeChild(ta);
}

async function callZhipuAPI(messages, model, taskType){
  // taskType: "script"=写脚本, "copy"=写文案, "video"=视频分析, "image"=图片分析, "chat"=问答
  
  if(taskType === "video"){
    // 视频分析 → 智谱
    if(state.settings.zhipuKey){
      return await callZhipuAPIInternal(messages, state.settings.zhipuKey, model);
    }
    showToast("视频分析需要智谱 API");
    return null;
  }
  
  if(taskType === "script"){
    // 写脚本 → DeepSeek
    if(state.settings.deepseekKey){
      return await callDeepSeekAPI(messages, state.settings.deepseekKey);
    }
    // 没有 DeepSeek，用智谱
    if(state.settings.zhipuKey){
      return await callZhipuAPIInternal(messages, state.settings.zhipuKey, model);
    }
    showToast("请配置 DeepSeek 或智谱 API");
    return null;
  }
  
  if(taskType === "copy"){

    if(state.settings.zhipuKey){
      return await callZhipuAPIInternal(messages, state.settings.zhipuKey, model);
    }
    // 没有智谱，用 DeepSeek
    if(state.settings.deepseekKey){
      return await callDeepSeekAPI(messages, state.settings.deepseekKey);
    }
    showToast("请配置智谱或 DeepSeek API");
    return null;
  }
  
  // 默认/问答/图片 → AICodeMirror
  if(state.settings.aicmKey){

  }
  // 没有 AICodeMirror，用智谱

  }
  showToast("请配置至少一个 AI API");
  return null;

// Claude API (Anthropic)
async function callClaudeAPI(messages, apiKey){
  try{
    // Anthropic messages 格式：system 单独传，其余 user/assistant 交替
    let systemPrompt = "";
    const chatMessages = [];
    for(const m of messages){
      if(m.role === "system"){
        systemPrompt += (systemPrompt?"\n":"") + m.content;
      } else {
        chatMessages.push({role:m.role, content:m.content});
      }
    }
    
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 2000,
        system: systemPrompt || undefined,
        messages: chatMessages
      })
    });
    
    if(!resp.ok){
      const errText = await resp.text();
      console.error("Claude API error:", resp.status, errText);
      if(resp.status === 401){
        showToast("API Key 无效，请检查");
      } else if(resp.status === 403){
        showToast("Claude API 需要开启浏览器访问权限");
      } else {
        showToast("AI 请求失败：" + resp.status);
      }
      return null;
    }
    
    const data = await resp.json();
    return data.content?.[0]?.text || "（无返回内容）";
  }catch(e){
    console.error(e);
    showToast("网络错误：" + e.message);
    return null;
  }
}

// 调用智谱视频理解 API
// 视频格式转换：将 mov/其他格式转为 mp4 base64
async function convertToMp4(videoBase64, mimeType){
  return new Promise((resolve)=>{
    // 如果已经是 mp4，直接返回
    if(mimeType && mimeType.includes("mp4")){
      resolve(videoBase64);
      return;
    }
    // 尝试用 video+canvas 截取关键帧作为图片传给智谱
    const video = document.createElement("video");
    video.muted = true;
    video.src = "data:" + (mimeType || "video/mp4") + ";base64," + videoBase64;
    video.crossOrigin = "anonymous";
    
    let frames = [];
    let done = false;
    
    const finish = (result)=>{
      if(done) return;
      done = true;
      resolve(result);
    };
    
    video.addEventListener("loadeddata", async ()=>{
      const duration = video.duration;
      if(!duration || duration < 1){
        finish(null);
        return;
      }
      // 截取4帧关键画面
      const interval = duration / 5;
      for(let i=1; i<=4; i++){
        const t = interval * i;
        try{
          const frame = await new Promise((res)=>{
            video.currentTime = t;
            video.addEventListener("seeked", ()=>{
              const canvas = document.createElement("canvas");
              canvas.width = 640;
              canvas.height = canvas.width * (video.videoHeight / video.videoWidth) || 360;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
              res(canvas.toDataURL("image/jpeg", 0.75));
            }, {once:true});
            setTimeout(()=>res(null), 3000);
          });
          if(frame) frames.push(frame);
        }catch(e){ /* skip */ }
      }
      finish(frames.length > 0 ? frames : null);
    });
    
    video.addEventListener("error", ()=>finish(null));
    setTimeout(()=>finish(null), 15000);
  });
}

// 从视频 base64 提取帧
function extractVideoFrames(videoBase64, count){
  return new Promise((resolve)=>{
    const video = document.createElement("video");
    video.muted = true;
    video.src = "data:video/mp4;base64," + videoBase64;
    const frames = [];
    
    video.addEventListener("loadeddata", async ()=>{
      const duration = video.duration;
      if(!duration || duration < 1){resolve([]);return}
      
      const interval = duration / (count + 1);
      
      for(let i=1;i<=count;i++){
        const t = interval * i;
        const frame = await captureFrame(video, t);
        if(frame) frames.push(frame);
      }
      resolve(frames);
    });
    
    video.addEventListener("error", ()=>{
      console.error("视频加载失败");
      resolve([]);
    });
    
    // 超时保护
    setTimeout(()=>resolve(frames), 10000);
  });
}

function captureFrame(video, time){
  return new Promise((resolve)=>{
    video.currentTime = time;
    video.addEventListener("seeked", ()=>{
      const canvas = document.createElement("canvas");
      canvas.width = 480; // 缩小图片节省流量
      canvas.height = canvas.width * (video.videoHeight / video.videoWidth);
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", 0.7));
    }, {once:true});
  });
}

function importData(){
  const input = document.createElement("input");
  input.type="file";input.accept=".json,application/json";
  input.onchange = e=>{
    const f = e.target.files[0];if(!f)return;
    const r = new FileReader();
    r.onload = ev=>{
      try{
        const d = JSON.parse(ev.target.result);
        if(d.clients && d.videos){
          state = {...state,...d,settings:{...state.settings,...(d.settings||{})}};
          save();render();closeModal();showToast("导入成功");
        } else {showToast("文件格式不正确")}
      }catch(err){showToast("导入失败")}
    };
    r.readAsText(f);
  };
  input.click();
}

// ============================================================
// 可视化看板
// ============================================================
function dashGetMonthDate(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth()+dashMonthOffset, 1);
}
function dashMonthLabel(){
  const d = dashGetMonthDate();
  return `${d.getFullYear()}年${d.getMonth()+1}月`;
}
function dashIsInMonth(s){
  if(!s) return false;
  const d = new Date(s+"T00:00:00");
  const m = dashGetMonthDate();
  return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth();
}
function dashChangeMonth(delta){
  dashMonthOffset += delta;
  renderDashboard();
}
function dashGoThisMonth(){
  dashMonthOffset = 0;
  renderDashboard();
}

// 统计某渠道在某月已发布数
function dashChannelPublished(clientId, channelId, monthDate){
  return state.videos.filter(v=>{
    if(v.clientId !== clientId) return false;
    const cs = v.channelStates?.[channelId];
    if(!cs || !cs.selected || !cs.published) return false;
    const pd = cs.publishDate || v.scheduledDate || "";
    if(!pd) return false;
    const d = new Date(pd+"T00:00:00");
    return d.getFullYear()===monthDate.getFullYear() && d.getMonth()===monthDate.getMonth();
  }).length;
}

// 统计某客户在某月已发布条数(按视频计，一条视频只要有一个渠道发了就算)
function dashClientMonthPublished(cid, monthDate){
  return state.videos.filter(v=>{
    if(v.clientId !== cid) return false;
    return Object.entries(v.channelStates||{}).some(([id,s])=>{
      if(!s.selected || !s.published) return false;
      const pd = s.publishDate || v.scheduledDate || "";
      if(!pd) return false;
      const d = new Date(pd+"T00:00:00");
      return d.getFullYear()===monthDate.getFullYear() && d.getMonth()===monthDate.getMonth();
    });
  }).length;
}

function renderDashboard(){
  const monthEl = document.getElementById("dashMonth");
  if(monthEl) monthEl.textContent = dashMonthLabel();
  const isCurMonth = dashMonthOffset === 0;
  const monthDate = dashGetMonthDate();
  const target = state.settings.monthlyTarget || 15;

  // —— 总览 ——
  const overview = document.getElementById("dashOverview");
  if(overview){
    const totalClients = state.clients.length;
    const totalPublished = state.clients.reduce((sum,c)=>sum + dashClientMonthPublished(c.id, monthDate), 0);
    const totalTarget = totalClients * target;
    const remain = Math.max(0, totalTarget - totalPublished);
    const pct = totalTarget > 0 ? Math.min(100, Math.round(totalPublished/totalTarget*100)) : 0;
    overview.innerHTML = `
      <div class="dash-overview-inner">
        <div class="dash-stat ok"><div class="num">${totalPublished}</div><div class="lbl">本月已发</div></div>
        <div class="dash-stat"><div class="num">${totalTarget}</div><div class="lbl">月度目标</div></div>
        <div class="dash-stat warn"><div class="num">${remain}</div><div class="lbl">剩余待发</div></div>
      </div>
      <div style="margin-top:12px;display:flex;align-items:center;gap:8px">
        <div class="dash-pbar-wrap" style="flex:1;margin:0">
          <div class="dash-pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,#4f7cff,#7b5cff)"></div>
        </div>
        <span style="font-size:12px;font-weight:700;color:#5a3e2b;min-width:36px;text-align:right">${pct}%</span>
      </div>
    `;
  }

  // —— 每客户卡片 ——
  const clientsEl = document.getElementById("dashClients");
  if(!clientsEl) return;
  if(state.clients.length === 0){
    clientsEl.innerHTML = `<div class="dash-empty">还没有客户数据<br>先去「客户」页添加客户吧</div>`;
    return;
  }

  clientsEl.innerHTML = state.clients.map(c=>{
    const color = c.color || "#4f7cff";
    const monthPub = dashClientMonthPublished(c.id, monthDate);
    const remain = Math.max(0, target - monthPub);
    const pct = target > 0 ? Math.min(100, Math.round(monthPub/target*100)) : 0;
    const badgeCls = pct >= 100 ? "done" : (remain <= 3 ? "short" : "");
    const badgeText = pct >= 100 ? "已达标" : `差${remain}条`;

    // 渠道明细
    const channelRows = (c.channels||[]).map(ch=>{
      const cnt = dashChannelPublished(c.id, ch.id, monthDate);
      const barPct = target > 0 ? Math.min(100, cnt/target*100) : 0;
      return `<div class="dash-channel-row">
        <span class="dash-ch-name">${esc(ch.name)}</span>
        <span class="dash-ch-bar-wrap"><span class="dash-ch-bar" style="width:${barPct}%;background:${color}"></span></span>
        <span class="dash-ch-cnt">${cnt}</span>
      </div>`;
    }).join("");

    // 本月视频表格：包含本月排期的所有视频 + 本月已发布的视频
    const monthVideos = clientVideos(c.id).filter(v=>{
      // 有排期日期在本月
      if(v.scheduledDate && dashIsInMonth(v.scheduledDate)) return true;
      // 有任一渠道在本月发布
      return Object.entries(v.channelStates||{}).some(([id,s])=>{
        if(!s.selected || !s.published) return false;
        const pd = s.publishDate || v.scheduledDate || "";
        return pd && dashIsInMonth(pd);
      });
    }).sort((a,b)=>{
      const da = a.scheduledDate || Object.values(a.channelStates||{}).find(s=>s.publishDate)?.publishDate || "9999";
      const db = b.scheduledDate || Object.values(b.channelStates||{}).find(s=>s.publishDate)?.publishDate || "9999";
      return (da||"").localeCompare(db||"");
    });

    let tableHtml = "";
    if(monthVideos.length > 0){
      const rows = monthVideos.map(v=>{
        const dateStr = v.scheduledDate || Object.values(v.channelStates||{}).find(s=>s.publishDate)?.publishDate || "";
        const dateDisp = dateStr ? `${parseInt(dateStr.split('-')[1])}/${parseInt(dateStr.split('-')[2])}` : "未排期";
        // 渠道状态标签
        const chips = Object.entries(v.channelStates||{})
          .filter(([id,s])=>s.selected)
          .map(([id,s])=>{
            const chName = getChannelName(c.id, id);
            if(s.published){
              return `<span class="dash-chip pub">${esc(chName)}✓</span>`;
            }
            return `<span class="dash-chip pend">${esc(chName)}…</span>`;
          }).join("");
        const unselectedChips = (c.channels||[])
          .filter(ch=>!v.channelStates?.[ch.id]?.selected)
          .map(ch=>`<span class="dash-chip no">${esc(ch.name)}</span>`).join("");
        // 状态标识
        const stMap = {pending:"待发",published:"已发",editing:"修改中"};
        const stColor = v.status==="published" ? "var(--green)" : (v.status==="pending" ? "#e8950a" : "var(--t2)");
        return `<tr>
          <td class="col-date">${dateDisp}</td>
          <td class="col-title">${esc(v.title)}</td>
          <td class="col-channels">${chips}${unselectedChips}</td>
          <td class="col-status" style="color:${stColor};font-weight:600;white-space:nowrap">${stMap[v.status]||v.status}</td>
        </tr>`;
      }).join("");
      tableHtml = `
        <div class="dash-table-h">发布明细 <span class="cnt">${monthVideos.length}条</span></div>
        <div class="dash-table-scroll">
        <table class="dash-table">
          <thead><tr><th>日期</th><th>视频</th><th>渠道</th><th>状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        </div>
      `;
    } else {
      tableHtml = `<div class="dash-empty" style="padding:16px">本月暂无发布记录</div>`;
    }

    return `<div class="dash-client-card">
      <div class="dash-client-head">
        <span class="dash-client-dot" style="background:${color}"></span>
        <span class="dash-client-name">${esc(c.name)}</span>
        <span class="dash-client-badge ${badgeCls}">${badgeText}</span>
      </div>
      <div class="dash-pbar-wrap">
        <div class="dash-pbar-fill" style="width:${pct}%;background:linear-gradient(90deg,${color},${color}cc)"></div>
      </div>
      <div class="dash-client-stats">
        <div class="dash-cs-item"><div class="dash-cs-num" style="color:${color}">${monthPub}</div><div class="dash-cs-lbl">已发</div></div>
        <div class="dash-cs-item"><div class="dash-cs-num">${target}</div><div class="dash-cs-lbl">目标</div></div>
        <div class="dash-cs-item"><div class="dash-cs-num">${remain}</div><div class="dash-cs-lbl">剩余</div></div>
        <div class="dash-cs-item"><div class="dash-cs-num">${pct}%</div><div class="dash-cs-lbl">进度</div></div>
      </div>
      ${channelRows ? `<div style="margin-top:4px"><div class="dash-table-h" style="margin-top:0">渠道分布</div>${channelRows}</div>` : ""}
      ${tableHtml}
    </div>`;
  }).join("");
}
